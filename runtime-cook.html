<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一锅出｜逐步试做</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif; background:#f4f2ea; color:#2c2e26; }
    body { margin:0; } main { max-width:720px; margin:0 auto; padding:28px 18px 56px; } a { color:#9b4f2e; font-weight:600; }
    .card { background:#fffdf8; border:1px solid #e5e0d4; border-radius:16px; padding:18px; margin-top:16px; }
    .empty { border-left:4px solid #b5613a; padding:14px 16px; background:#fff8f2; border-radius:10px; line-height:1.7; }
    .meta { color:#777968; font-size:13px; } button { border:0; border-radius:10px; padding:10px 14px; background:#b5613a; color:white; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <p><a id="browseLink" href="/recipes/?mode=preview">← 返回预览运行菜谱</a></p>
    <div id="content" class="card" aria-live="polite">正在读取执行合同…</div>
  </main>
  <script>
    const content = document.getElementById('content');
    const browseLink = document.getElementById('browseLink');
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') === 'production' ? 'production' : 'preview';
    const modeLabel = mode === 'production' ? '生产' : '预览';
    const approvalNotice = mode === 'production' ? '' : ' · 尚未 Production Approved';
    document.title = `一锅出｜${modeLabel}逐步试做`;
    browseLink.href = `/recipes/?mode=${mode}`;
    browseLink.textContent = `← 返回${modeLabel}运行菜谱`;
    const isProductionEntry = entry => entry?.planner_runtime_eligible === true
      && entry?.production_approved === true;
    const isPreviewEntry = entry => entry?.planner_runtime_eligible === true
      && entry?.production_approved === false;
    const isVisibleEntry = mode === 'production' ? isProductionEntry : isPreviewEntry;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function load() {
      try {
        const response = await fetch('/runtime-one-pot-catalog.v1.json', { cache:'no-store' });
        if (!response.ok) throw new Error('runtime catalog unavailable');
        const catalog = await response.json();
        const id = params.get('id');
        const entry = (Array.isArray(catalog.entries) ? catalog.entries : []).find(value => value.recipe_id === id && isVisibleEntry(value));
        if (!entry) {
          content.innerHTML = `<div class="empty"><strong>这道菜还没有${modeLabel}执行合同。</strong><p>研究卡、来源卡和其他发布层级不会直接变成${modeLabel}步骤。请返回${modeLabel}运行目录，或回到首页。</p><p><a href="/recipes/?mode=${mode}">返回${modeLabel}运行目录</a> · <a href="/">返回首页</a></p></div>`;
          return;
        }
        content.innerHTML = `<h1>${esc(entry.canonical_name)}</h1><p class="meta">${modeLabel}运行目录 ${esc(catalog.runtime_catalog_version)}${approvalNotice}</p><p>该菜已通过${modeLabel}运行合同${mode === 'production' ? '' : '，尚未 Production Approved'}，可继续接入逐步执行界面。</p><p><a href="/recipes/?mode=${mode}">返回${modeLabel}运行菜谱</a></p>`;
      } catch (error) {
        content.innerHTML = `<div class="empty"><strong>暂时无法读取${modeLabel}执行合同。</strong><p>${esc(error.message)}</p><button onclick="location.reload()">重新加载</button></div>`;
      }
    }
    load();
  </script>
</body>
</html>
