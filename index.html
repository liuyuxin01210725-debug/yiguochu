<style>

function normFoodName(s) {
  // 统一括号宽度 + 去空格小写, 但保留 干/鲜/熟 等状态后缀(不再丢)
  return String(s || '').toLowerCase().replace(/（/g, '(').replace(/）/g, ')').replace(/\s+/g, '');
}
function baseFoodName(s) {
  // 取基名(去掉括号及之后): 菠菜(焯熟)→菠菜, 鸡腿肉(熟,去皮)→鸡腿肉
  return normFoodName(s).replace(/\(.*$/, '');
}

// 忌口/食材先经 FOOD_ALIAS 归一到基名: 基围虾仁→虾仁, 鸡大腿→鸡腿; 查不到就用自身基名
function allergyBaseName(s) {
  const q = normFoodName(s);
  if (!q) return '';
  const aliasId = FOOD_ALIAS[q] || FOOD_ALIAS[baseFoodName(s)];
  if (aliasId) { const f = FOODS.find(x => x.id === aliasId); if (f) return baseFoodName(f.name); }
  return baseFoodName(s);
}
// 忌口匹配: 双向子串 + 仅当忌口词等于 ALLERGEN_GROUPS 类别名本身时按组扩展(组成员如「虾仁」不牵连同组)
// 同时用「原词基名」和「alias 归一名」两路形态: alias 只用于对齐, 不许收窄保护面(单用归一名会让 豆腐≠豆腐干)
function allergyMatchForms(s) {
  return [...new Set([baseFoodName(s), allergyBaseName(s)].filter(Boolean))];
}
function matchAllergy(dislikeTerm, ingredientName) {
  const dForms = allergyMatchForms(dislikeTerm), iForms = allergyMatchForms(ingredientName);
  if (!dForms.length || !iForms.length) return false;
  const groupNames = dForms.filter(d => ALLERGEN_GROUPS[d]);
  if (groupNames.length) {
    if (dForms.some(d => iForms.some(i => i === d || (d.length >= 2 && i.includes(d))))) return true;
    return groupNames.some(g => ALLERGEN_GROUPS[g].some(m => {
      const bForms = allergyMatchForms(m);
      return bForms.some(b => iForms.some(i => i.includes(b) || b.includes(i)));
    }));
  }
  return dForms.some(d => iForms.some(i => i.includes(d) || d.includes(i)));
}
// 只忽略用量很小的香辛料/酸味料。油、糖、盐和复合酱料必须参与热量或钠估算。
const SEASONINGS = new Set(['料酒','黄酒','米酒','醋','白醋','陈醋','香醋','米醋','姜','生姜','姜末','姜片','姜丝','姜蓉','葱','葱花','香葱','小葱','大葱','葱段','葱姜','蒜','蒜末','蒜蓉','蒜泥','蒜瓣','蒜头','咖喱粉','五香粉','十三香','胡椒粉','白胡椒','黑胡椒','胡椒','辣椒粉','干辣椒','小米辣','花椒','八角','桂皮','香叶','孜然','香菜','柠檬汁','青柠','柠檬','茶叶','普洱','紫苏','紫苏叶']);
const SEASONING_STUB = { id:'_seasoning', name:'调味料', category:'调味品', seasoning:true, kcal:0, p:0, mg:0, k:0, ca:0, fe:0, zn:0, na:0, vc:0, vd:0, fb:0, w3:0 };
function isSeasoning(name) { return SEASONINGS.has(normFoodName(name)) || SEASONINGS.has(baseFoodName(name)); }
function lookupFoodNutrition(name) {
  const q = normFoodName(name);
  if (!q) return null;
  // 小用量香辛料/酸味料 → 零贡献 stub；油糖盐和酱料继续查库或标估算。
  if (isSeasoning(name)) return SEASONING_STUB;
  // 0. 人工 alias (用 id, 不会因中文名细节而错)
  const aliasId = FOOD_ALIAS[q] || FOOD_ALIAS[baseFoodName(name)];
  if (aliasId) { const f = FOODS.find(x => x.id === aliasId); if (f) return f; }
  // 1. 全名精确(含状态): 香菇(干) 只配 香菇(干), 不会配到 香菇(鲜)
  let hits = FOODS.filter(f => normFoodName(f.name) === q);
  if (hits.length === 1) return hits[0];
  if (hits.length > 1) return null;
  // 2. 去括号基名「精确相等」(不是前缀!): 菠菜→菠菜(焯熟)。基名相同的多条→不确定→估算
  const qb = baseFoodName(name);
  if (qb.length >= 2) {
    hits = FOODS.filter(f => baseFoodName(f.name) === qb);
    if (hits.length === 1) return hits[0];
  }
  return null;
}

// 换一换历史跨会话冷却(F-A): 读回/落盘前先修剪——丢弃 7 天前的条目, 最多留 20 条
const SWAP_HISTORY_TTL = 7 * 24 * 60 * 60 * 1000;
function pruneSwapHistory(list, now) {
  const t = typeof now === 'number' ? now : Date.now();
  const normalized = (Array.isArray(list) ? list : [])
    .filter(h => h && typeof h.ts === 'number' && (h.planId || h.name || h.base) && t - h.ts < SWAP_HISTORY_TTL)
    .map(h => ({
      name: String(h.name || ''), base: String(h.base || ''), fam: String(h.fam || ''),
      planId: String(h.planId || ''), kind: h.kind === 'started' ? 'started' : 'swapped', ts: h.ts,
    }));
  const latest = new Map();
  for (const entry of normalized) {
    const key = entry.planId
      ? 'plan:' + entry.planId
      : 'legacy:' + entry.base + '\u0000' + entry.name + '\u0000' + entry.fam;
    const prior = latest.get(key);
    if (!prior || entry.ts >= prior.ts) latest.set(key, entry);
  }
  return [...latest.values()]
    .sort((left, right) => left.ts - right.ts)
    .slice(-20);
}
// state.swapHistory 就是持久层在内存的镜像: 修剪后写回 localStorage

}

async function postPlannerV2(path, body) {

  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), path === '/generate-plan' ? GENERATION_REQUEST_TIMEOUT_MS : 15000);
  let response;
  try {
    response = await fetch(endpoints[0], {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body),
      signal:ctrl.signal, cache:'no-store',
    });
  } catch (error) {
    throw genError(error && error.name === 'AbortError' ? 'timeout' : 'network', 'request failed', true);
  } finally { clearTimeout(tid); }
  let payload;
  try { payload = await response.json(); }
  catch (_error) { throw badJsonResponseError(response, endpoints[0]); }
  if (!response.ok) {
    if (payload && ['stale_plan','no_alternative_plan','no_valid_plan','needs_user_decision'].includes(payload.status)) return payload;

      payload && (payload.error || payload.message), response.status >= 500);

    ? '<p class="pantry-plan-note">暂时没有稳妥搭配：' + esc(plan.unplanned.join('、')) + '。它们会继续保留，不会被假装用掉。</p>'
    : '<p class="pantry-plan-note">每张方案都按你这次填写的完整食材独立计算。</p>';
  const title = plan.kind === 'sequence' ? '按顺序分成几锅' : '选一个本锅方案';
  const text = plan.kind === 'sequence'
    ? '你选了 ' + total + ' 种食材。下面是连续计划，不是互相替代的选项；先做第一锅，再处理后面的食材。'
    : '下面每张卡都重新对照你填写的 ' + total + ' 种食材，分别说明本锅用上、暂时不用和还需准备什么。';
  const sequenceAction = plan.kind === 'sequence' && plan.groups.length
    ? '<button class="btn btn-primary" data-act="choose-pantry-group" data-group-index="0">先做第一锅</button>'
    : '';
  const quickRelaxation = plan.kind === 'alternatives' && state.profile.intent === 'quick' && maxCoverage < total
    ? '<div class="pantry-plan-note">快手模式只看 30 分钟内的菜谱。想用上更多食材，可以放宽到正常时长。</div>'
      + '<button class="btn btn-ghost" data-act="relax-pantry-time">放宽到正常时长</button>'
    : '';
  return '<div class="screen fallback-screen"><section class="fallback-banner">'
    + '<div class="fb-banner-row"><span class="fb-banner-icon">'
    + icon('bowl',{size:18,sw:1.7,stroke:'#c08a3e'})
    + '</span><div><div class="fb-banner-title">' + esc(title) + '</div>'
    + '<p class="fb-banner-text">' + esc(text) + '</p>'
    + '</div></div><div class="pantry-plan-list">' + cards + '</div>' + unplanned + quickRelaxation + sequenceAction
    + '<button class="btn btn-ghost" data-act="edit-safe-profile">返回调整食材</button>'
    + '</section></div>';
}
function choosePantryGroup(index) {
  const plan = normalizePantryPlan(state.pantryPlan);
  const group = plan.groups[index];
  if (!group) return;
  runGenerate({ pantryOverride:group.usedItems, pantryOriginal:plan.original, selectedBaseRecipeId:group.recipeId });
}
function samePantryIdentitySet(left, right) {
  const keys = value => uniquePantryItems(value).map(pantryIdentity).filter(Boolean).sort();
  const a = keys(left), b = keys(right);
  return a.length === b.length && a.every((item, index) => item === b[index]);
}
function legacySwapOptions(swap) {
  const result = { swap };
  const context = state.dish && state.dish.pantryContext;
  const currentPantry = uniquePantryItems(String(state.profile.pantry || '').split(/[,，、\s]+/));
  const original = uniquePantryItems(context && context.original);
  const requested = uniquePantryItems(context && context.requested);
  if (requested.length && samePantryIdentitySet(currentPantry, original)) {
    result.pantryOverride = requested;
    result.pantryOriginal = original;
  }
  return result;
}
async function relaxPantryTime() {
  state.profile.intent = 'normal';
  state.pantryPlan = null;
  STORE.saveProfile(state.profile);
  return runPrimaryFlow();
}
// 换一换候选枯竭屏(F-B): 累计历史把可搭候选耗尽(422)时的显式出口——清记录从头轮, 或调整食材; 不自动重试
function swapExhaustedScreen() {
  return '<div class="screen fallback-screen"><section class="fallback-banner">'
    + '<div class="fb-banner-row"><span class="fb-banner-icon">'
    + icon('pin',{size:18,sw:1.7,stroke:'#c08a3e'})
    + '</span><div><div class="fb-banner-title">能搭的菜都换过一遍了</div>'
    + '<p class="fb-banner-text">最近换过的菜都会避开，能搭的候选已经用完。可以清掉最近的记录从头轮，或者调整食材。</p>'
    + '</div></div><div class="dish-actions">'
    + '<button class="btn btn-primary" data-act="clear-swap-history">' + icon('refresh',{size:18,sw:1.9}) + '<span>清掉记录继续换</span></button>'
    + '<button class="btn btn-ghost" data-act="edit-safe-profile">' + icon('edit',{size:18,sw:1.9}) + '<span>调整食材</span></button>'
    + '</div></section></div>';
}
// 「清掉记录继续换」: 用户主动清掉换一换历史(内存+持久层), 再按上次换一换意图重新生成。
// runGenerate 会像普通换一换一样把当前菜重新记入历史——本就是要换掉它, 从头轮不代表再看一遍当前这道。
function clearSwapHistoryAndRetry() {
  state.swapHistory = [];
  STORE.saveSwapHistory(state.swapHistory);
  runGenerate({ swap: state.lastSwapIntent || 'any' });
}
function unsafePantryStopScreen() {
  const pantry = (state.profile.pantry || '').split(/[,，、\s]+/).filter(Boolean);
  const pantryText = pantry.length ? pantry.join('、') : '这些食材';
  return '<div class="screen fallback-screen"><section class="fallback-banner">'
    + '<div class="fb-banner-row"><span class="fb-banner-icon">'
    + icon('pin',{size:18,sw:1.7,stroke:'#c08a3e'})
    + '</span><div><div class="fb-banner-title">这次菜谱没有通过检查</div>'
    + '<p class="fb-banner-text">围绕“' + esc(pantryText) + '”生成的做法没有通过食材或熟制检查，因此没有展示无关的应急菜。你的输入已经保留。</p>'
    + '</div></div><div class="dish-actions">'
    + '<button class="btn btn-primary" data-act="retry">' + icon('refresh',{size:18,sw:1.9}) + '<span>重新生成</span></button>'
    + '<button class="btn btn-ghost" data-act="edit-safe-profile">' + icon('edit',{size:18,sw:1.9}) + '<span>调整现有食材</span></button>'
    + '</div></section></div>';
}
// 失败屏文案(F2/F4 错误码契约): 按 error.code 给真实原因的人话, 不再承诺应急菜
function genFailureCopy(err) {
  const code = err && err.code;
  if (code === 'local_start_required') return { title:'请先启动本地版本', text:'请双击 start.command 启动本地版本。' };
  if (code === 'pantry_too_many') return { title:'食材有点多，先精简一下', text:'一次最多填写 20 种食材。你的输入已经完整保留，请删掉不打算这几顿使用的食材后再试。' };
  if (code === 'portion_too_small') return { title:'这锅份量偏少', text:'按你选择的份数，这道做法不够一顿主餐。换一道更完整的会更合适。' };
  if (code === 'recipe_not_suitable') return { title:'这道不太符合本次要求', text:'做法本身不一定不安全，但份量、时间或复杂度不适合你这次的选择。' };
  if (code === 'timeout') return { title:'这次等太久了', text:'等太久了，可能是网络或服务器忙。' };
  if (code === 'network') return { title:'这次网络没接上', text:'手机到云端接口这一下没有连稳。检查网络后点「重新生成」通常就好了。' };
  if (code === 'rate_limited') return { title:'今天生成次数太多了', text:'刚才可能已经触发每日保护额度。晚点再试会更稳。' };
  if (code === 'budget_exceeded') return { title:'今天大家用得有点多', text:'到了每日总量保护上限。明天再来会更稳。' };
  if (code === 'budget_unavailable') return { title:'服务暂时不可用', text:'服务暂时不可用，请稍后再试。' };
  if (code === 'service_unavailable' || code === 'upstream_error' || code === 'upstream_timeout') return { title:'服务现在有点忙', text:'这不是食材或菜谱的问题。服务暂时没有接住这次请求，请稍后再试；你的输入已经保留。' };
  return { title:'这次没生成出来', text:'生成失败了，再试一次？' }; // 其他 5xx/上游错误(bad_json/bad_shape/http_5xx 等)
}
// 失败屏(F2): 只显示真实错误原因 + 重新生成/修改食材忌口, 不渲染任何菜品和营养区
function generationFailureScreen(err) {
  const copy = genFailureCopy(err);
  const retryLabel = err && err.code === 'portion_too_small' ? '换一道更完整的' : '重新生成';
  const keepsPlannerChoice = plannerDirectRecommendEnabled()
    && state.displayedPlan && state.displayedPlan.plan && state.planRequestSnapshot;
  const selectedPlan = keepsPlannerChoice
    ? plannerPotsHtml(state.displayedPlan)
      + '<p class="pantry-plan-note">这套组合还在，只是详细步骤这次没有生成成功。</p>'
    : '';
  const retryAction = keepsPlannerChoice ? 'retry-generate-plan' : 'retry';
  return '<div class="screen fallback-screen"><section class="fallback-banner">'
    + '<div class="fb-banner-row"><span class="fb-banner-icon">'
    + icon('pin',{size:18,sw:1.7,stroke:'#c08a3e'})
    + '</span><div><div class="fb-banner-title">' + esc(copy.title) + '</div>'
    + '<p class="fb-banner-text">' + esc(copy.text) + '</p>'
    + '</div></div>' + selectedPlan + '<div class="dish-actions">'
    + '<button class="btn btn-primary" data-act="' + retryAction + '">' + icon('refresh',{size:18,sw:1.9}) + '<span>' + esc(retryLabel) + '</span></button>'
    + '<button class="btn btn-ghost" data-act="edit-safe-profile">' + icon('edit',{size:18,sw:1.9}) + '<span>修改食材忌口</span></button>'
    + '</div></section></div>';
}
function openEditableProfile() {
  state.profileEditing = true;
  state.view = 'profile';
  window.scrollTo(0, 0);
  render();
}
function showGenerationFailure(err) {
  state.lastGenError = normalizeGenError(err);
  if (state.lastGenError.code === 'portion_too_small') {
    rememberSessionRejectedCandidate(state.lastGenError.baseRecipeId);
  }
  state.notice = '';
  if (state.lastGenError.code === 'pantry_needs_grouping' && state.lastGenError.pantryPlan.groups.length) {
    state.pantryPlan = state.lastGenError.pantryPlan;
    state.view = 'pantry-plan';
    window.scrollTo(0, 0);
    document.getElementById('root').innerHTML = pantryPlanScreen();
    return;
  }
  if (state.lastGenError.code === 'no_compatible_pantry_recipe') {
    state.view = 'pantry-stop';
    window.scrollTo(0, 0);
    // 换过几轮后 422 多半是历史把候选耗尽了(F-B): 给专属屏和恢复路径; 无历史(初始生成)仍走原停止屏
    document.getElementById('root').innerHTML = state.swapHistory.length ? swapExhaustedScreen() : pantryStopScreen();
    return;
  }
  if (state.lastGenError.code === 'unsafe_recipe' && String(state.profile.pantry || '').trim()) {
    state.view = 'pantry-stop';
    window.scrollTo(0, 0);
    document.getElementById('root').innerHTML = unsafePantryStopScreen();
    return;
  }
  if (shouldUseRiceSafeStop(state.lastGenError)) {
    state.view = 'safe-stop';
    window.scrollTo(0, 0);
    document.getElementById('root').innerHTML = safeStopScreen();
    return;
  }
  // 其余错误一律走失败屏(F2): 真实原因 + 重新生成/修改食材忌口, 不再往 state 里塞静态兜底菜
  state.view = 'gen-failed';
  window.scrollTo(0, 0);
  document.getElementById('root').innerHTML = generationFailureScreen(state.lastGenError);
}
// 换一换历史维护(F-A): 点换一换时把当前菜(带 ts)累计进历史并落盘, 后端据此避开, 能换到第三、四道。
// 全新生成不再清空——持久层跨会话冷却的意义就是"上次吃过的也避开", 这里只做修剪落盘;
// session 内刚换掉的菜仍在 state.swapHistory 里, 照常参与当次避开。
function updateSwapHistory(kind) {
  if (kind !== 'swapped' && kind !== 'started') { persistSwapHistory(); return; }
  if (!state.dish) return;
  const cur = {
    name: state.dish.name || '', base: state.dish.baseRecipeId || '', fam: state.dish.familyId || '',
    kind, ts: Date.now(),
  };
  const duplicateIndex = state.swapHistory.findIndex(h => (cur.base && h.base === cur.base) || (!cur.base && h.name === cur.name));
  if (duplicateIndex >= 0) state.swapHistory[duplicateIndex] = cur;
  else state.swapHistory.push(cur);
  persistSwapHistory();
}
function rememberSessionRejectedCandidate(baseRecipeId) {
  const base = boundedText(baseRecipeId, 100);
  if (!base) return;
  state.sessionRejectedBaseRecipes = boundedTextList([
    ...(Array.isArray(state.sessionRejectedBaseRecipes) ? state.sessionRejectedBaseRecipes : []), base,
  ], 20, 100);
}
async function runGenerate(opts) {
  opts = opts || {};
  clearGen();
  const myId = ++genId;
  const previousDish = opts.swap && state.dish ? state.dish : null;
  state.notice = '';
  state.lastGenError = null;
  if (typeof location !== 'undefined' && location.protocol === 'file:') {
    showGenerationFailure(genError('local_start_required', '请双击 start.command 启动本地版本。', false));
    return;
  }
  const pantryCount = String(state.profile.pantry || '').split(/[,，、\s]+/).map(item => item.trim()).filter(Boolean).length;
  if (pantryCount > 20) {
    showGenerationFailure(genError('pantry_too_many', '一次最多填写 20 种食材', false));
    return;
  }
  if (opts.swap) state.lastSwapIntent = opts.swap; // 记住最后一次换一换意图(F-B): 枯竭屏「清掉记录继续换」按它重发
  updateSwapHistory(opts.swap ? 'swapped' : undefined);
  state.view = 'generating'; state.genStage = 0; render();
  genTimers.push(setTimeout(() => { if (myId === genId) { state.genStage = 1; render(); } }, 1100));
  genTimers.push(setTimeout(() => { if (myId === genId) { state.genStage = 2; render(); } }, 2400));
  const started = Date.now();
  try {
    const dish = await fetchRealDish(opts);
    if (myId !== genId) return;
    const wait = Math.max(0, 2000 - (Date.now() - started));
    genTimers.push(setTimeout(() => { if (myId === genId) showResult(dish); }, wait));
  } catch (err) {
    if (myId !== genId) return;
    clearGen(); // 防止旧动画计时器在失败屏显示后再次 render 把它覆盖
    genTimers.push(setTimeout(() => {
      if (myId !== genId) return;
      const normalized = normalizeGenError(err);
      if (previousDish) {
        if (normalized.code === 'portion_too_small') rememberSessionRejectedCandidate(normalized.baseRecipeId);
        const noAlternative = normalized.code === 'no_compatible_pantry_recipe' || normalized.code === 'no_alternative_recipe';
        const serviceBusy = ['service_unavailable','upstream_error','upstream_timeout','budget_unavailable'].includes(normalized.code);
        showResult(previousDish, normalized.code === 'portion_too_small'
          ? '刚换到的方案份量不足，已保留当前这道。可以换个方向再试。'
          : noAlternative
            ? '当前组合只有一个可靠的一锅方案，已经保留在下面。'
            : serviceBusy
              ? '服务现在有点忙，当前这道还在。请稍后再换，不需要连续点击。'
              : '这次没换成，当前这道还在。可以换个方向再试。');
        state.noAlternativeSwap = noAlternative;
        state.swapOpen = true;
        render();
        return;
      }
      showGenerationFailure(err);
    }, 400));
  }
};
document.getElementById('root').addEventListener('click', (e) => {
  const target = e.target.closest('[data-act]');
  if (!target) return;
  if (target.dataset.act === 'edit-safe-profile') openEditableProfile();
  else if (target.dataset.act === 'clear-swap-history') clearSwapHistoryAndRetry();
});

// 可信菜谱补充字段在独立兼容层处理，避免模型字段直接进入页面 HTML。
const mapDishWithoutAdaptation = mapDish;
mapDish = function(res, targets) {
  const dish = mapDishWithoutAdaptation(res, targets);
  dish.adaptationNote = boundedText(res && res.adaptation_note, 400);
  return dish;
};
const recipeBasisBlockWithoutAdaptation = recipeBasisBlock;
recipeBasisBlock = function(d) {
  return recipeBasisBlockWithoutAdaptation(d);
};
const scoreDishBeforeQuickLimit = scoreDish;
scoreDish = function(d) {
  const trustedPantryTradeoff = d
    && d.purpose === 'quick'
    && d.minutes <= 30
    && boundedText(d.baseRecipeId, 100)
    && boundedTextList(d.usedPantry, 16, 80).length > 0;
  // 可信库存菜仍可使用后端允许的 4 步与动态食材行数，但 quick 的总时长绝不放宽到 30 分钟以上。
  const scored = trustedPantryTradeoff
    ? { ...d, purpose: 'pantry' }
    : (d && d.purpose === 'quick' && d.minutes <= 30 ? { ...d, minutes: 25 } : d);
  return scoreDishBeforeQuickLimit(scored);
};

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js?v=__YIGUOCHU_BUILD_ID__', { updateViaCache:'none' })

}</script>
