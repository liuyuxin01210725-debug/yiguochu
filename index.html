<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #e6e9dd; --app-bg: #f4f2ea; --surface: #fcfbf6; --surface-2: #efece2;
    --ink: #2c2e26; --ink-2: #5f6256; --muted: #8b8d7e; --line: #e6e2d6; --line-2: #efece3;
    --clay: #b5613a; --clay-press: color-mix(in srgb, var(--clay) 86%, #000);
    --clay-soft: color-mix(in srgb, var(--clay) 16%, #fffaf6); --clay-ink: color-mix(in srgb, var(--clay) 72%, #2a1810);
    --sage: #6f8a52; --sage-soft: color-mix(in srgb, var(--sage) 24%, #fbfdf5); --sage-ink: color-mix(in srgb, var(--sage) 70%, #16210d);
    --amber: #c08a3e;
    --serif: "Noto Serif SC", "Songti SC", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  body { font-family: var(--sans); background: radial-gradient(1200px 600px at 70% -10%, #eef0e6 0%, transparent 60%), var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; min-height: 100vh; }
  .app { max-width: 440px; margin: 0 auto; min-height: 100vh; background: var(--app-bg); position: relative; }
  .screen { padding: 30px 14px 42px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }

  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .chip-form { background: var(--clay-soft); color: var(--clay-ink); font-weight: 600; }
  .chip-flavor, .chip-neutral { background: var(--surface-2); color: var(--ink-2); }
  .meta { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .meta svg { opacity: 0.85; }
  .dish-meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line); display: inline-block; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-family: inherit; font-weight: 600; cursor: pointer; border-radius: 13px; transition: transform 0.05s, background 0.14s; border: none; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--clay); color: #fff; padding: 13px 18px; font-size: 16px; box-shadow: 0 1px 2px rgba(138,74,43,0.25); }
  .btn-primary:hover { background: var(--clay-press); }
  .btn-ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink-2); padding: 12px 16px; font-size: 14.5px; }
  .btn-ghost:hover { border-color: #cfc8b8; }
  .btn-ghost-on { background: var(--ink); border: 1.5px solid var(--ink); color: #fff; padding: 12px 16px; font-size: 14.5px; }
  .btn-full { width: 100%; }
  .swap-tray { margin-top: 10px; background: var(--surface-2); border-radius: 13px; padding: 12px 13px; animation: swapIn 0.18s ease; }
  @keyframes swapIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .swap-cap { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 9px; }
  .swap-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .swap-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: border-color 0.12s, color 0.12s; }
  .swap-chip:hover { border-color: var(--clay); color: var(--clay); }
  .swap-any { color: var(--clay); border-color: var(--clay-soft); background: var(--clay-soft); font-weight: 600; }
  .swap-any:hover { background: #ecd6c8; }
  .step-head { display: flex; align-items: center; gap: 9px; }
  .step-n { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); color: var(--app-bg); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-title { font-size: 16px; font-weight: 600; color: var(--ink); margin: 0; flex: 1; }
  .step-right, .block-aside { font-size: 12px; color: var(--muted); }
  .link-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--clay); font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0; font-family: inherit; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 17px; }

  .photo-slot { position: relative; height: 158px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
  .photo-stripes { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent, transparent 11px, rgba(60,60,40,0.035) 11px, rgba(60,60,40,0.035) 22px); }
  .photo-cap { position: relative; font-family: "SFMono-Regular", ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); letter-spacing: 0.2px; background: var(--app-bg); padding: 4px 11px; border-radius: 7px; }

  .dish-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 1px 2px rgba(40,40,30,0.03), 0 12px 26px rgba(40,40,30,0.05); }
  .dish-body { padding: 15px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .dish-eyebrow { display: flex; align-items: center; justify-content: space-between; }
  .dish-eyebrow > span { font-size: 11.5px; letter-spacing: 1.5px; color: var(--clay); font-weight: 600; }
  .dish-name { font-family: var(--serif); font-size: 27px; line-height: 1.25; font-weight: 700; color: var(--ink); margin: 0; letter-spacing: -0.2px; }
  .dish-flavor { display: flex; gap: 6px; flex-wrap: wrap; }
  .dish-taste { margin: 2px 0 0; font-size: 14px; line-height: 1.65; color: var(--ink-2); }
  .dish-quick { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 4px; }
  .quick-item { flex: 1; padding: 9px 6px; text-align: center; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
  .quick-item:last-child { border-right: none; }
  .quick-item b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
  .quick-item span { font-size: 11px; color: var(--muted); }
  .dish-actions { display: flex; gap: 10px; margin-top: 6px; }
  .dish-actions .btn-primary { flex: 1; }
  .chosen-hint { margin: 0; font-size: 12.5px; color: var(--sage-ink); background: var(--sage-soft); padding: 9px 12px; border-radius: 10px; line-height: 1.5; }
  .why-card { display: flex; gap: 10px; align-items: flex-start; background: var(--clay-soft); border-radius: 14px; padding: 13px 15px; }
  .why-mark { flex-shrink: 0; margin-top: 1px; }
  .why-text { margin: 0; font-size: 14px; line-height: 1.6; color: var(--clay-ink); }
  .recipe-basis { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 15px; }
  .basis-line { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
  .basis-line + .basis-line { margin-top: 6px; }
  .basis-line strong { color: var(--ink); font-weight: 600; }
  .basis-unused { color: var(--muted); }
  .basis-sources { margin-top: 10px; border-top: 1px solid var(--line-2); padding-top: 9px; }
  .basis-sources summary { color: var(--clay); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .basis-source { padding: 9px 0 2px; font-size: 12px; line-height: 1.55; color: var(--muted); }
  .basis-source + .basis-source { border-top: 1px solid var(--line-2); margin-top: 7px; }
  .basis-source-title { color: var(--ink-2); font-weight: 600; overflow-wrap: anywhere; }
  .basis-source a { color: var(--clay); overflow-wrap: anywhere; }
  .basis-source-meta { margin-top: 2px; overflow-wrap: anywhere; }
  .ing-sub { font-size: 12px; color: var(--muted); margin: 7px 0 2px; }
  .ing-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .ing-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  .ing-row:last-child { border-bottom: none; }
  .ing-bullet { width: 5px; height: 5px; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
  .ing-name { flex: 1; font-size: 14.5px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .est-tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; line-height: 15px; }
  .ing-grams { font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; background: var(--surface-2); padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
  .ing-edit { display: flex; align-items: center; gap: 6px; }
  .stepper { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .stepper:active { background: var(--surface-2); }
  .ing-grams-ed { min-width: 36px; text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .del { width: 26px; height: 26px; border-radius: 8px; border: none; background: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .del:hover { color: var(--clay); }
  .add-ing { margin-top: 11px; width: 100%; border: 1.5px dashed var(--line); background: none; color: var(--ink-2); border-radius: 11px; padding: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; }
  .add-ing:hover { border-color: var(--clay); color: var(--clay); }
  .steps { list-style: none; margin: 11px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .step-row { display: flex; gap: 11px; }
  .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .step-text { font-size: 14px; line-height: 1.6; color: var(--ink-2); padding-top: 1px; }
  .supp-block { background: #f7faef; border-color: #e3ead2; }
  .supp-lead { font-size: 13px; line-height: 1.6; color: var(--ink-2); margin: 9px 0 12px; }
  .supp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .supp-row { display: flex; align-items: center; gap: 11px; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 11px 13px; cursor: pointer; transition: all 0.12s; }
  .supp-row.checked { background: var(--sage-soft); border-color: #ccd9b1; }
  .supp-check { width: 23px; height: 23px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .supp-row.checked .supp-check { background: var(--sage); border-color: var(--sage); }
  .supp-icon { flex-shrink: 0; }
  .supp-main { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .supp-title { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .supp-sub { font-size: 12px; color: var(--muted); }
  .supp-detail { font-size: 13px; font-weight: 600; color: var(--sage-ink); white-space: nowrap; }
  .vd-hint { display: flex; gap: 8px; align-items: flex-start; margin-top: 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  .vd-hint svg { flex-shrink: 0; margin-top: 1px; }
  .week-card { margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
  .week-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; width: 100%; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .week-top-l { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .week-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .week-sub { font-size: 12px; color: var(--muted); }
  .week-chev { display: flex; transition: transform 0.18s; }
  .week-chev.open { transform: rotate(180deg); }
  .week-days { display: flex; justify-content: space-between; gap: 4px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .week-dot { width: 27px; height: 27px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .week-dot.done { background: var(--sage); }
  .week-dot.skip { background: var(--surface-2); border: 1px solid var(--line); }
  .week-dot.todo { background: transparent; border: 1.5px dashed #d8d3c4; }
  .week-dlabel { font-size: 11px; color: var(--muted); }
  .week-fish { display: flex; align-items: center; gap: 8px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
  .week-fish-text { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .week-fish-pips { display: flex; gap: 4px; }
  .fish-pip { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
  .fish-pip.on { background: var(--sage); border-color: var(--sage); }
  .week-fish-note { font-size: 12px; color: var(--muted); margin-left: auto; }
  .week-expand { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 8px; }
  .week-sec { font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .week-log { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .wlog { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .wlog-d { width: 18px; height: 18px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .wlog.on .wlog-d { background: var(--sage); color: #fff; }
  .wlog-dish { flex: 1; font-size: 13.5px; color: var(--ink); }
  .wlog.off .wlog-dish, .wlog.wait .wlog-dish { color: var(--muted); }
  .wlog-fish { display: flex; flex-shrink: 0; }
  .variety-line { display: flex; align-items: baseline; gap: 9px; }
  .variety-count { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--sage-ink); }
  .variety-note { font-size: 12px; color: var(--muted); }
  .variety-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .vchip { font-size: 12px; color: var(--ink-2); background: var(--surface-2); padding: 3px 9px; border-radius: 8px; }
  .vchip.more { color: var(--muted); background: none; padding-left: 0; }
  .week-takeaway { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--ink-2); background: var(--sage-soft); padding: 10px 12px; border-radius: 10px; }
  .nutri-block { padding: 0; overflow: hidden; }
  .nutri-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; background: none; border: none; cursor: pointer; font-family: inherit; }
  .nutri-head-l { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .nutri-title { font-size: 15px; font-weight: 600; color: var(--ink); margin: 0; }
  .nutri-tag { font-size: 12px; color: var(--muted); }
  .nutri-summary { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 17px 15px; }
  .nutri-mini { font-size: 12px; color: var(--ink-2); background: var(--surface-2); padding: 4px 9px; border-radius: 8px; }
  .nutri-mini b { font-weight: 600; }
  .nutri-mini.status-soft { background: #f6edda; color: #93701f; }
  .nutri-rows { list-style: none; margin: 0; padding: 2px 17px 16px; display: flex; flex-direction: column; }
  .nutri-row { display: flex; align-items: center; gap: 9px; padding: 11px 0; border-top: 1px solid var(--line-2); }
  .nutri-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .nutri-label { font-size: 13.5px; font-weight: 600; color: var(--ink); min-width: 70px; }
  .nutri-note { font-size: 12.5px; color: var(--muted); flex: 1; }
  .nutri-status { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .status-enough { color: var(--sage-ink); } .nutri-dot.status-enough { background: var(--sage); }
  .status-soft { color: #a9842f; } .nutri-dot.status-soft { background: #d8b15e; }
  .status-week { color: var(--muted); } .nutri-dot.status-week { background: var(--muted); }
  .result-foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 8px 16px 2px; }
  .gen-notice { display: flex; gap: 8px; align-items: flex-start; background: #fdf6e8; border: 1px solid #ecd9a8; border-radius: 12px; padding: 10px 13px; font-size: 12.5px; line-height: 1.5; color: #7a6233; }
  .gen-notice svg { flex-shrink: 0; margin-top: 1px; }
  .col-main, .col-side { display: flex; flex-direction: column; gap: 12px; }

  /* 档案页 */
  .profile-screen { gap: 17px; }
  .app-head { padding: 2px 4px 0; }
  .wordmark { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); }
  .app-tagline { margin: 9px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .form-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .field-hint { font-size: 12px; color: var(--muted); }
  /* V10: 首页常见食材 chips + 换一换食材条 */
  .field-label-aside { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .pantry-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .pantry-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px; font-size: 12.5px; font-family: inherit; transition: all 0.12s; }

  .pantry-chip.adding { padding: 1px 3px 1px 9px; }
  .pchip-input { border: none; outline: none; font: inherit; width: 66px; background: none; color: var(--ink); }
  .pchip-addbtn { color: var(--clay); font-weight: 600; padding: 5px 10px; }
  .swap-pantry { display: flex; align-items: center; gap: 7px; margin: 9px 0 11px; padding: 8px 11px; background: #fff; border: 1px solid var(--line); border-radius: 11px; }
  .swap-pantry-lbl { font-size: 12px; color: var(--muted); font-weight: 500; flex-shrink: 0; }
  .swap-pantry-val { flex: 1; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swap-pantry-btn { flex-shrink: 0; border: none; background: var(--surface-2); color: var(--clay); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }

  .seg { flex: 1; border: none; background: none; padding: 8px 6px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.12s; white-space: nowrap; }
  .seg.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  .mini-row .segmented { flex: 1.3; }
  .num-field { flex: 1; display: flex; align-items: center; background: var(--surface-2); border-radius: 11px; padding: 0 11px; }

function normFoodName(s) {
  // 统一括号宽度 + 去空格小写, 但保留 干/鲜/熟 等状态后缀(不再丢)
  return String(s || '').toLowerCase().replace(/（/g, '(').replace(/）/g, ')').replace(/\s+/g, '');
}
function baseFoodName(s) {
  // 取基名(去掉括号及之后): 菠菜(焯熟)→菠菜, 鸡腿肉(熟,去皮)→鸡腿肉
  return normFoodName(s).replace(/\(.*$/, '');
}

function isSeasoning(name) { return SEASONINGS.has(normFoodName(name)) || SEASONINGS.has(baseFoodName(name)); }
function lookupFoodNutrition(name) {
  const q = normFoodName(name);
  if (!q) return null;
  // V9: 调味料 → 零贡献 stub(视为命中, 不算 AI 估算)
  if (isSeasoning(name)) return SEASONING_STUB;
  // 0. 人工 alias (用 id, 不会因中文名细节而错)
  const aliasId = FOOD_ALIAS[q] || FOOD_ALIAS[baseFoodName(name)];
  if (aliasId) { const f = FOODS.find(x => x.id === aliasId); if (f) return f; }
  // 1. 全名精确(含状态): 香菇(干) 只配 香菇(干), 不会配到 香菇(鲜)
  let hits = FOODS.filter(f => normFoodName(f.name) === q);
  if (hits.length === 1) return hits[0];
  if (hits.length > 1) return null;
  // 2. 去括号基名「精确相等」(不是前缀!): 菠菜→菠菜(焯熟)。基名相同的多条→不确定→估算
  const qb = baseFoodName(name);
  if (qb.length >= 2) {
    hits = FOODS.filter(f => baseFoodName(f.name) === qb);
    if (hits.length === 1) return hits[0];
  }
  return null;
}

function nutriFor(d) {
  const n = d.nutrients || {}, t = d._targets || {};
  const pc = k => (t[k] ? (n[k] || 0) / t[k] : 1);
  const rows = [];
  rows.push({ label:'热量', value: Math.round(n.kcal != null ? n.kcal : d.kcal) + '', note: pc('kcal') >= 0.85 ? '今天够一天的量' : (pc('kcal') >= 0.6 ? '比一天目标略少，没关系' : '这锅约小半天的量，今天记得再吃一顿'), status: pc('kcal') >= 0.7 ? 'enough' : 'soft' });
  rows.push({ label:'蛋白', value: Math.round(n.p != null ? n.p : d.protein) + 'g', note: pc('p') >= 0.85 ? '充足' : '稍欠，明天补点', status: pc('p') >= 0.7 ? 'enough' : 'soft' });
  rows.push({ label:'纤维', value: Math.round(n.fb || 0) + 'g', note: pc('fb') >= 0.7 ? '杂粮和蔬菜带来的' : '多来点蔬菜杂粮', status: pc('fb') >= 0.6 ? 'enough' : 'soft' });
  rows.push({ label:'钙', value: Math.round(n.ca || 0) + 'mg', note: pc('ca') >= 0.7 ? '这锅钙不少' : '一锅难凑齐，配杯奶就好', status: pc('ca') >= 0.7 ? 'enough' : 'soft' });
  const naOver = !!(t.na && (n.na || 0) > t.na);
  rows.push({ label:'钠', value: Math.round(n.na || 0) + 'mg', note: naOver ? '口味重了点，下次少放盐' : '不算重，挺好', status: naOver ? 'soft' : 'enough' });
  rows.push({ label:'Omega-3', value: d.hasFish ? '够了' : '看一周', note: d.hasFish ? '这道有鱼' : '本周吃鱼没满，下锅会补', status: d.hasFish ? 'enough' : 'week' });
  return rows;
}

// 看一周：从本地选菜记录算真实节奏（七天点阵 / 吃鱼 / 食材种类）。无记录时为空，用几天自然长出来。
function buildWeek() {
  let choices = []; try { choices = (JSON.parse(localStorage.getItem('yiguochu_v1') || '{}').choices) || []; } catch (e) {}
  const now = new Date(); now.setHours(0,0,0,0);
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const L = ['一','二','三','四','五','六','日'];

}

// 真实生成：POST 到 proxy /generate-meal，解析后映射
function scoreDish(d) {
  const t = d._targets || {}; let fails = 0;
  if (Array.isArray(d.validationFlags) && d.validationFlags.length) fails += d.validationFlags.length;
  if ((d.steps || []).length > 4) fails++;
  if (d.minutes > 45) fails++;
  if (t.kcal && d.kcal < t.kcal * 0.35) fails++; // 仅拦真垃圾输出: DeepSeek 系统性交付 43-67% 目标热量, 二次生成治不了系统性偏差, 只会双倍烧钱; 诚实文案(三档)负责向用户说明

function fallbackCopy(err) {

  if (code === 'budget_exceeded') return { title:'今天大家用得有点多', text:'到了每日总量保护上限。下面先给一个应急搭配；明天再来会更稳。' };
  if (code === 'timeout') return { title:'这次等太久了', text:'生成服务没有在限定时间内返回。下面先给一个应急搭配；点「再试一次」会重新生成。' };

async function fetchRealDish(opts) {
  const p = state.profile, targets = computeTargets(p);

  const swap = (swapIntent && swapIntent !== 'any') ? swapIntent : null;
  const splitC = s => (s || '').split(/[,，、]+/).map(x => x.trim()).filter(Boolean);
  const splitW = s => (s || '').split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean);

  if (swap && state.dish && state.dish.name) recent.unshift(state.dish.name);

    const nm = (it && it.name) || ''; if (!nm) return;
    const f = lookupFoodNutrition(nm); const cat = f && f.category;
    if (cat === '肉禽' || cat === '水产' || cat === '蛋类' || PROTEIN_RE.test(nm)) proteinSet.add(nm);
  });
  if (state.dish && Array.isArray(state.dish.ingredients)) collectProteins(state.dish.ingredients);
  try { ((JSON.parse(localStorage.getItem('yiguochu_v1') || '{}').choices) || []).slice(-4).forEach(c => collectProteins(c.snapshot && c.snapshot.ingredients)); } catch (e) {}
  // pantry(想用掉)的食材绝不进"轮换排除"名单, 否则换一换会把你想用掉的食材也避开
  const pantryNorm = new Set(splitC(p.pantry).map(x => normFoodName(x)));
  const recentProteins = [...proteinSet].filter(x => !pantryNorm.has(normFoodName(x))).slice(0, 10);
  const cookedAny = !!(state.week && state.week.days && state.week.days.some(d => d.cooked === true));
  const body = { meal_name: '今日推荐 (一日量, 可分 1-2 顿吃)', targets, constraints: {
    diet: 'omnivore', pantry: splitC(p.pantry), dislikes: splitW(p.dislikes),
    recent_dishes: recent, recent_base_recipes: recentBaseRecipes, recent_families: recentFamilies, swap_intent: swapIntent,
    week_fish_short: cookedAny && state.week.fishDone < state.week.fishTarget,
    recent_ingredients: recentProteins.length ? { recent_proteins: recentProteins, window_size: recentProteins.length } : undefined,
    swap_hint: swap ? SWAP_HINT[swap] : '',
    feedback_hint: STORE.feedbackHint(),
    balance_low: bh ? bh.low.map(x => x.name + '(可用' + x.foods + ')') : [],

let genTimers = [], genId = 0;
const clearGen = () => { genTimers.forEach(clearTimeout); genTimers = []; };
function showResult(d, notice) {

  const others = DISHES.filter(d => d.id !== state.dish.id);

  if (swap === 'lighter') { const lo = Math.min(...others.map(d => d.kcal)); pool = others.filter(d => d.kcal <= lo + 40); }
  else if (swap === 'easier') pool = others.filter(d => d.minutes <= 28 && d.difficulty === 1);

window.__yiguochuStats = function () { try { return STORE.getStats(); } catch (e) { return {}; } };
async function runGenerate(opts) {

  const myId = ++genId;

  state.lastGenError = null;

  genTimers.push(setTimeout(() => { if (myId === genId) { state.genStage = 2; render(); } }, 2400));

    }, 400));

}
function choose() {
  STORE.bumpStat('choose');

  STORE.recordNutritionChoice(state.dish);
  state.week = buildWeek(); // 重建周数据: 今天的点立刻亮、吃鱼计数同步(buildWeek 从刚写入的 choices 算, 不再手动++)

// 语音输入：Web Speech API(zh-CN)。需 https 或 localhost + Chrome/Safari；file:// 或不支持时提示手打。
let _rec = null;
function startVoice(id) {

  if (!SR) { alert('这个浏览器/环境不支持语音输入，手打就行（建议 Chrome 或 Safari，且网页用 https 打开）。'); return; }

  const rec = new SR(); _rec = rec; rec.lang = 'zh-CN'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { const t = (e.results[0][0].transcript || '').replace(/[。.\s]+$/, ''); if (t) el.value = el.value ? (el.value.replace(/[，,、\s]*$/, '') + '，' + t) : t; };

});
