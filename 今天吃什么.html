  }

  body {

  }

    margin: 0 0 8px;

    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1::before {
    content: "🍚";
    font-size: 32px;
  }
  header p {
    margin: 0;
    color: var(--c-mute);

    padding: 8px 12px;
    background: #fff;
    color: var(--c-text);
    transition: border-color 0.15s, box-shadow 0.15s;

  input:focus, select:focus {
    outline: none;
    border-color: var(--c-brand);

  button.primary {
    background: var(--c-brand);

    font-size: 15px;

    border: 1px solid var(--c-border);
    color: var(--c-mute);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;

  .meal-food {

    color: var(--c-text);

    line-height: 1.65;

    <div class="field" style="flex: 1; min-width: 200px;">

    </div>

  <div class="actions">

</section>

<!-- 输出 -->
<section id="output"></section>

</main>

// ====== 工具函数 ======
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmt(n, digits = 0) {
  if (n === undefined || n === null || isNaN(n)) return '-';
  return Number(n).toFixed(digits);
}
function localDateString(date = new Date()) {
  const d = date instanceof Date ? date : new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseListInput(value, commaOnly = false) {
  // commaOnly: 只按逗号/顿号拆, 保留「鸡胸肉 200g」这种带数量的整片段 (修 #4)
  const sep = commaOnly ? /[,，、]+/ : /[,，、\s]+/;
  return (value || '').split(sep).map(s => s.trim()).filter(Boolean);
}
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function rand(min, max) {
  return Math.round(min + Math.random() * (max - min));
}

// ====== 每日营养目标（含目标调整）======
function computeTargets(profile) {
  const { sex, age, weight, height, activity, goal } = profile;
  const isMale = sex === 'male';
  const bmr = isMale
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;
  let kcal = Math.round(bmr * activity);
  let p = Math.round(weight * 1.0);
  let mg = age <= 64 ? 330 : 320;
  let k = 2000;
  let ca = age < 50 ? 800 : 1000;
  let fe;
  if (isMale) fe = 12;
  else fe = age < 50 ? 18 : 10;
  let zn = isMale ? 12 : 8.5;
  let na = 2000;
  let vc = 100;
  let vd = age <= 64 ? 10 : 15;
  let fb = isMale ? 30 : 25;
  let w3 = isMale ? 1.6 : 1.1;

  // 目标调整
  if (goal === 'cut')        { kcal = Math.round(kcal * 0.8); p = Math.round(p * 1.2); }
  else if (goal === 'bulk')  { kcal = kcal + 200; p = Math.round(weight * 1.6); }
  else if (goal === 'antiInflam') { w3 = +(w3 * 1.5).toFixed(2); fb = Math.round(fb * 1.1); }
  else if (goal === 'pregnancy')  { fe = 25; ca = 1000; }

  return { kcal, p, fb, mg, k, ca, fe, zn, na, vc, vd, w3 };
}

const V1_STORAGE_KEY = 'nutritionToolData_v1';  // 跟 V1 工具相同

// V4.4 自定义食物：读 V1 的 customFoods，加进 FOODS 让推荐/编辑都能用到
function getCustomFoods() {
  try {
    const raw = localStorage.getItem(V1_STORAGE_KEY);
    if (!raw) return [];
    const data = JSON.parse(raw);
    return data.customFoods || [];
  } catch (e) { return []; }
}
function addCustomFood(food) {
  try {
    const raw = localStorage.getItem(V1_STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : {};
    data.customFoods = data.customFoods || [];
    data.customFoods.push(food);
    localStorage.setItem(V1_STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
  if (!FOODS.find(f => f.id === food.id)) FOODS.push(food);
}
function loadCustomFoodsIntoFoods() {
  const customs = getCustomFoods();
  customs.forEach(cf => {
    if (!FOODS.find(f => f.id === cf.id || f.name === cf.name)) FOODS.push(cf);
  });
}

// V4.5 调本地 AI 代理查营养, V6.1 加 30s timeout
async function lookupFoodViaAI(name) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 30000);
  try {
    const resp = await fetch('http://localhost:8765/lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
      signal: ctrl.signal,
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    return await resp.json();
  } catch (e) {
    if (e.name === 'AbortError') return { _error: '查询超时 (30s)。AI 太慢或网卡。' };
    return { _error: e.message || '无法连接到本地 AI 代理（端口 8765）' };
  } finally {
    clearTimeout(tid);
  }
}

function getOverrides() {
  try {
    const raw = localStorage.getItem(V1_STORAGE_KEY);
    if (!raw) return {};
    const data = JSON.parse(raw);
    return data.targetOverrides || {};
  } catch (e) { return {}; }
}

function setOverrides(overrides) {
  try {
    const raw = localStorage.getItem(V1_STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : {};
    data.targetOverrides = overrides || {};
    localStorage.setItem(V1_STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

// 合并 auto + override：override > 0 才生效
function getEffectiveTargets(profile) {
  const auto = computeTargets(profile);
  const overrides = getOverrides();
  const merged = { ...auto };
  NUTRIENTS.forEach(n => {
    const o = overrides[n.key];
    if (typeof o === 'number' && o > 0) merged[n.key] = o;
  });
  return merged;
}

function renderOverrideGrid() {
  // V6: override grid 已经隐藏, function 留个空 body 防 null pointer
  const wrap = document.getElementById('overrides-grid');
  if (!wrap || wrap.style.display === 'none') return;
  const overrides = getOverrides();
  // 拿当前 profile 算 auto，用于显示 placeholder
  const profile = getProfileFromForm();
  const auto = computeTargets(profile);
  wrap.innerHTML = '';
  NUTRIENTS.forEach(n => {
    const ov = overrides[n.key];
    const hasOv = typeof ov === 'number' && ov > 0;
    const autoVal = auto[n.key];
    const step = (n.key === 'vd' || n.key === 'zn' || n.key === 'w3') ? '0.1' : '1';
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;flex-direction:column;gap:2px;font-size:12px;';
    div.innerHTML = `
      <label style="color:#666;">${n.name} (${n.unit})${hasOv ? ' <span style="color:#2c7a7b;font-weight:600;">✓自定义</span>' : ''}</label>
      <input type="number" data-override-key="${n.key}"
             min="0" step="${step}"
             placeholder="默认 ${fmt(autoVal, autoVal < 10 ? 1 : 0)}"
             value="${hasOv ? ov : ''}"
             style="padding:5px 8px;font-size:13px;">
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('input[data-override-key]').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.overrideKey;
      const v = inp.value.trim();
      const ov = getOverrides();
      if (v === '' || isNaN(parseFloat(v)) || parseFloat(v) <= 0) {
        delete ov[key];
      } else {
        ov[key] = parseFloat(v);
      }
      setOverrides(ov);
      renderOverrideGrid();  // 刷新显示 ✓自定义 标签
    });
  });
}

  glutenFree: { name: '无麸质', filter: f => !/面|麦|馒头/.test(f.name) },
};

// ====== 食物分类池子 ======
function getPool(allFoods, kind) {
  switch (kind) {
    case '主食':
      return allFoods.filter(f => f.category === '主食谷物' && !f.name.includes('（干）') && !f.name.includes('（生）'));
    case '早餐主食':
      return allFoods.filter(f => ['燕麦片（干）','全麦面包','糙米饭（熟）','馒头（白面）'].includes(f.name));
    case '蛋白':
      return allFoods.filter(f => ['肉禽','水产','蛋类'].includes(f.category) || ['d-4','d-7','d-9','v-8'].includes(f.id));
    case '早餐蛋白':
      return allFoods.filter(f => ['e-1','e-2','d-1','d-2','d-6','v-8','d-4'].includes(f.id));
    case '蔬菜':
      // V6.2: 排除淀粉类(s-12 南瓜/s-13 土豆/s-14 红薯, 走主食)
      // + 排除辛香调味类(v-5 大蒜) — fallback 给蔬菜 slot 80-160g, 不能选大蒜
      return allFoods.filter(f => f.category === '蔬菜' && !['s-12','s-13','s-14','v-5'].includes(f.id));
    case '水果':
      return allFoods.filter(f => f.category === '水果');
    case '坚果':
      return allFoods.filter(f => f.category === '坚果种子');
    case '油脂':
      return allFoods.filter(f => ['v-16','v-17','v-18'].includes(f.id));
    case '加餐':
      return allFoods.filter(f => f.category === '水果' || ['n-1','n-2','n-3','d-2'].includes(f.id));
    default:
      return [];
  }
}

// ====== 餐模板 ======
// V6.1: 主餐 fallback 加强到 8+ 食材, 3+ 不同蔬菜, 兑现 V5.2 "300g 蔬菜 + 多样性" 承诺

      { kind: '蔬菜', grams: [120, 160] },      // 深色叶菜
      { kind: '蔬菜', grams: [80, 120] },       // 根茎/瓜茄

      { kind: '水果', grams: [100, 150] },
      { kind: '坚果', grams: [10, 20], optional: true },
    ]},
    { name: '午餐', slots: [
      { kind: '主食', grams: [150, 200] },
      { kind: '蛋白', grams: [80, 120] },
      { kind: '蔬菜', grams: [180, 250] },

    ]},
    { name: '晚餐', slots: [

}

// ====== 生成一餐 ======
// V6.1: 同 meal 内同 kind 不重复 (避免 3 个蔬菜 slot 都挑菠菜)
function generateMeal(template, availableFoods, pantry = []) {
  const items = [];
  const usedIds = new Set();
  const pantryTerms = (pantry || []).map(s => String(s).trim()).filter(Boolean);
  const matchesPantry = f => pantryTerms.some(t => { const w = t.replace(/[\s\d].*$/, '') || t; return f.name.includes(w) || w.includes(f.name); });
  for (const slot of template.slots) {
    if (slot.optional && Math.random() < 0.4) continue;
    let pool = getPool(availableFoods, slot.kind).filter(f => !usedIds.has(f.id));
    if (pool.length === 0) {
      // 用光了同 kind 的池子, 退回原池子
      pool = getPool(availableFoods, slot.kind);
      if (pool.length === 0) continue;
    }
    // V8: 降级模式也优先用 pantry 里有的食材 (修 #2: fallback 原来无视 pantry)
    const pantryPool = pantryTerms.length ? pool.filter(matchesPantry) : [];
    const food = pantryPool.length > 0 ? pick(pantryPool) : pick(pool);
    usedIds.add(food.id);
    // V8.1 #3: 干货(香菇干/木耳干/紫菜干)用独立小克数槽, 防 fallback 抽出「紫菜干93g」这种离谱份量
    const grams = food.form === 'dry' ? rand(3, 12) : rand(slot.grams[0], slot.grams[1]);
    items.push({ food, grams, slot: slot.kind });
  }
  return { name: template.name, items };
}

function computeMealNutrients(meal) {
  const totals = {};
  NUTRIENTS.forEach(n => totals[n.key] = 0);
  meal.items.forEach(({ food, grams }) => {
    const factor = grams / 100;
    NUTRIENTS.forEach(n => totals[n.key] += (food[n.key] || 0) * factor);
  });
  return totals;
}

function addRecentIngredients(meal) {
  if (!meal || !meal.items) return;

    if (/鸡|鸭|鹅|猪|牛|羊|鱼|虾|蟹|贝|墨鱼|鱿鱼|章鱼|蛤|蚌|蛋|豆腐|腐竹|豆干|腐皮|豆浆|黄豆|黑豆|鹰嘴豆|扁豆|肉|腊|火腿|培根|香肠/.test(n)) {
      proteins.push(n);
    } else if (/米|面|饭|馒头|面包|粥|麦|燕麦|藜麦|小米|玉米|杂粮|糙米|薯|藕粉|挂面/.test(n)) {
      carbs.push(n);
    } else if (/菜|椒|瓜|笋|菇|耳|豆角|豆芽|藕|胡萝卜|番茄|西红柿|花椰|青菜|油菜|菠菜|生菜|芹菜|莴|韭|海带|紫甘蓝|空心|苋|茄|萝卜|南瓜|冬瓜|丝瓜|苦瓜|黄瓜|茭白|苤蓝|蚕豆|豌豆|毛豆|芦笋|香椿|荠菜|蘑/.test(n)) {
      veggies.push(n);
    }
  }
  const entry = { ts: Date.now(), proteins, veggies, carbs };
  const cur = getRecentIngredients();
  const next = [...cur, entry].slice(-INGREDIENTS_WINDOW);
  localStorage.setItem(RECENT_INGREDIENTS_KEY, JSON.stringify(next));
}
// 汇总最近窗口里出现过的食材分类, 给 LLM 作为"别再用了"参考
function summarizeRecentIngredients() {
  const recent = getRecentIngredients();
  if (recent.length === 0) return null;
  const allProteins = [...new Set(recent.flatMap(e => e.proteins))];
  const allVeggies = [...new Set(recent.flatMap(e => e.veggies))];
  const allCarbs = [...new Set(recent.flatMap(e => e.carbs))];
  return {
    window_size: recent.length,
    recent_proteins: allProteins,
    recent_veggies: allVeggies,
    recent_carbs: allCarbs,
  };
}

// ====== 生成一天 ======
// V5: 用 AI 生成菜饭, fallback 到模板
// V6.2: 先 health check, proxy 不在就直接 fallback, 不等 30s
async function checkProxy() {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 1500);
  try {
    const r = await fetch('http://localhost:8765/health', { signal: ctrl.signal });
    clearTimeout(tid);
    return r.ok;
  } catch (e) {
    clearTimeout(tid);
    return false;
  }
}

// V8.2 #1: 单道菜「硬约束 + 贴近目标」打分, 用于选A的自动重试取更优。
// 只用能从 AI 输出可靠算出的项: 步骤数 / 时长 / 热量。蔬菜克数靠分类无法可靠判断, 不作为重试触发——
// 否则会因「没匹配上本地库的蔬菜」误判不足、白烧一次 API(用户多等却没必要)。
function scoreMeal(res, target) {
  if (!res || res._error || !Array.isArray(res.ingredients)) return { ok: false, score: -1, fails: ['无有效结果'] };
  const steps = Array.isArray(res.steps) ? res.steps.length : 0;
  const prep = +res.prep_minutes || 0;
  let kcal = 0;
  for (const ing of res.ingredients) {
    const g = +ing.grams || 0;
    const db = lookupFoodNutrition(ing.name);
    kcal += (db ? db.kcal : (+ing.kcal || 0)) * g / 100;
  }
  const fails = [];
  if (steps > 4) fails.push('步骤 ' + steps + ' 步(>4)');
  if (prep > 45) fails.push(prep + ' 分钟(>45)');
  if (target && target.kcal && kcal < target.kcal * 0.75) fails.push('热量 ' + Math.round(kcal) + '/' + Math.round(target.kcal) + ' kcal(<75%)');
  const kcalRatio = (target && target.kcal) ? Math.min(kcal / target.kcal, 1.1) : 1;
  const score = (3 - fails.length) * 10 + kcalRatio * 5 - Math.max(0, steps - 4) - Math.max(0, prep - 45) / 10;
  return { ok: fails.length === 0, score, fails, kcal: Math.round(kcal) };
}

async function fetchMealOnce(payload) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch('http://localhost:8765/generate-meal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), signal: ctrl.signal,
    });
    clearTimeout(tid);
    if (!r.ok) return { _error: 'http ' + r.status };
    return await r.json();
  } catch (e) {
    clearTimeout(tid);
    return { _error: (e && e.name === 'AbortError') ? 'AI 生成超时 (30s)' : String(e) };
  }
}

// 选A: 不达标自动重试「一次」, 取两版里更优的。绝不循环——单锅菜本就凑不齐全天目标, 死循环只会让用户干等。
async function fetchMealWithRetry(payload, target) {
  const first = await fetchMealOnce(payload);
  const s1 = scoreMeal(first, target);
  if (s1.ok || first._error) {
    if (first && !first._error) first._validation = s1;
    return first;
  }
  const second = await fetchMealOnce(payload);
  const s2 = scoreMeal(second, target);
  const useSecond = !second._error && s2.score > s1.score;
  const best = useSecond ? second : first;
  if (best && !best._error) { best._validation = useSecond ? s2 : s1; best._retried = true; }
  return best;
}

async function generateDay(profile) {
  let foods = FOODS.filter(DIETS[profile.diet].filter);
  if (profile.dislikes && profile.dislikes.length > 0) {
    foods = foods.filter(f => !profile.dislikes.some(d => f.name.includes(d)));
  }
  const targets = getEffectiveTargets(profile);
  const mealCount = profile.meals;
  const perMealTargets = {};
  NUTRIENTS.forEach(n => perMealTargets[n.key] = targets[n.key] / mealCount);

  const mealNames = ['今日推荐 (一日量, 可分 1-2 顿吃)'];  // V5.2: 始终 1 大锅
  const aiAvailable = await checkProxy();

  // V5.1: 拿最近菜名, 传给 proxy 让 LLM 避开
  const recentDishes = getRecentDishes();
  // V7.1: 拿最近 7 次食材分类汇总, 让 LLM 在主蛋白/主蔬菜/主食上轮换
  const recentIngredients = summarizeRecentIngredients();

  // V5: 并行 AI 生成每餐菜饭, V6.1 加 30s timeout, V6.2 health 不通直接跳
  let aiResults;
  if (!aiAvailable) {
    aiResults = mealNames.map(() => ({ _error: 'PROXY_OFFLINE' }));
  } else {
    // V8.2 #1(选A): 每道菜不达标自动重试一次、取更优; fetchMealWithRetry 内部已含 30s 超时处理
    const _bh = balancingHints(perMealTargets);  // V8.5: 后台读最近7天已选的菜, 算出持续偏低/钠偏高
    const aiPromises = mealNames.map(mn => fetchMealWithRetry({
      meal_name: mn,
      targets: perMealTargets,
      constraints: { diet: profile.diet, pantry: profile.pantry, dislikes: profile.dislikes, recent_dishes: recentDishes, recent_ingredients: recentIngredients, week_fish_short: fishThisWeek() < FISH_WEEK_TARGET, balance_low: _bh ? _bh.low.map(x => x.name + '(可用' + x.foods + ')') : [], balance_high_na: _bh ? _bh.highNa : false },
    }, perMealTargets));
    aiResults = await Promise.all(aiPromises);
  }

  // V5.1: 把新生成的菜名加进历史
  const newDishNames = aiResults.filter(r => r && r.dish_name).map(r => r.dish_name);
  if (newDishNames.length > 0) addRecentDishes(newDishNames);

  // 把 AI 响应转成 meal 对象 (或 fallback)
  const meals = aiResults.map((res, i) => {
    if (res._error || !Array.isArray(res.ingredients)) {
      // V6.2: 用户友好的 fallback 文案 (区分 proxy 离线 vs AI 调用失败)
      console.warn('AI 生成不可用, fallback:', res._error);
      const tmpl = getMealTemplates(mealCount)[i];
      const tmplMeal = generateMeal(tmpl, foods, profile.pantry);
      tmplMeal.dishName = '基础版菜饭';
      tmplMeal.fallbackReason = res._error === 'PROXY_OFFLINE'
        ? '本地 AI 未启动 — 这只是营养凑齐的食材清单, 未必好吃。要真菜饭, 双击文件夹里 start.command 启动 AI, 再点「再换一组」。'
        : 'AI 服务出问题: ' + res._error + ' — 这只是营养凑齐的食材清单, 未必好吃。';
      return tmplMeal;
    }
    const items = res.ingredients.map(ing => {
      const id = 'ai-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      // V8 #0: 本地成分表能匹配上的, 用权威值覆盖 AI 报的数; 匹配不上才保留 AI 估算并标记
      const db = lookupFoodNutrition(ing.name);
      const food = db
        ? { id, name: ing.name, category: 'AI菜饭', source: 'db', matchedName: db.name,
            kcal: db.kcal, p: db.p, fb: db.fb, mg: db.mg, k: db.k, ca: db.ca,
            fe: db.fe, zn: db.zn, na: db.na, vc: db.vc, vd: db.vd, w3: db.w3 }
        : { id, name: ing.name, category: 'AI菜饭', source: 'ai',
            kcal: +ing.kcal || 0, p: +ing.p || 0, fb: +ing.fb || 0,
            mg: +ing.mg || 0, k: +ing.k || 0, ca: +ing.ca || 0,
            fe: +ing.fe || 0, zn: +ing.zn || 0, na: +ing.na || 0,
            vc: +ing.vc || 0, vd: +ing.vd || 0, w3: +ing.w3 || 0 };
      return { food, grams: +ing.grams || 0, slot: '配料' };
    });
    return {
      name: mealNames[i],
      dishName: res.dish_name,
      steps: Array.isArray(res.steps) ? res.steps : [],
      aiNote: res.note || '',
      aiWarning: res._warning || '',  // V6.2: 服务端 sanity warning 透传
      intelligence: Array.isArray(res._intelligence) ? res._intelligence : [],  // V7.2: 后台智能解释
      // V7.4: 成品预期信号
      flavorTags: Array.isArray(res.flavor_tags) ? res.flavor_tags : [],
      prepMinutes: +res.prep_minutes || null,
      difficulty: +res.difficulty || null,
      tastePreview: res.taste_preview || '',
      validation: res._validation || null,  // V8.2 #1: 残余缺口, 诚实显示
      retried: !!res._retried,
      items,
    };
  });

  meals.forEach(m => m.nutrients = computeMealNutrients(m));
  // V7.4.1 修 bug: recent_ingredients 不再每次 generate 都加, 改成只在用户点 "就吃这个 ✓" 才加
  // 之前 bug: 用户点 N 次 "再换一组" 就累积 N 条 recent, 文案说 "最近 N 次吃过", 用户感觉是幻觉
  // 现在: 只记真选定的菜, 跟用户 mental model 对齐
  const dayTotals = {};
  NUTRIENTS.forEach(n => dayTotals[n.key] = 0);
  meals.forEach(m => NUTRIENTS.forEach(n => dayTotals[n.key] += m.nutrients[n.key]));
  return { meals, dayTotals, targets, availableFoods: foods };
}

// ====== 简单制作说明 ======
function cookingNote(meal) {
  const names = meal.items.map(i => i.food.name);
  const hasRice = names.some(n => n.includes('米饭'));
  const hasNoodle = names.some(n => n.includes('面条'));
  const hasBread = names.some(n => n.includes('面包') || n.includes('馒头'));
  const hasOat = names.some(n => n.includes('燕麦'));
  const hasMeat = meal.items.some(i => ['肉禽','水产'].includes(i.food.category));
  const hasVeg = meal.items.some(i => i.food.category === '蔬菜');
  const hasEgg = meal.items.some(i => i.food.category === '蛋类');

  if (hasOat) return '燕麦煮 5min + 鲜奶/酸奶/蛋分开吃 + 水果/坚果点缀。';
  if (hasBread) return '面包烤一下；蛋白和水果配着吃。';
  if (hasRice && hasMeat && hasVeg) return '一锅出：肉切丁腌一下 + 蔬菜焯水/切块 + 米饭 → 电饭锅蒸或铸铁锅 35min。';
  if (hasNoodle) return '面条煮熟；蔬菜+蛋白浇头；少量酱油/醋调味。';
  if (hasEgg && meal.items.length <= 3) return '蛋煮/煎/蒸 + 配菜简单切；少油快炒。';
  return '蛋白先煮/煎，蔬菜焯水或快炒，配主食。';
}

// ====== 渲染 ======
function renderMealItem(item, mealIdx, slotIdx, isEditing) {
  if (isEditing) {
    return `<li data-meal="${mealIdx}" data-slot="${slotIdx}" class="editing">
      <span style="display:flex;gap:6px;align-items:center;flex:1;">
        <span class="meal-slot">${escapeHtml(item.slot)}</span>
        <input type="text" class="edit-food" list="food-list-v4" value="${escapeHtml(item.food.name)}" style="flex:1;min-width:140px;padding:4px 8px;font-size:13px;">
        <input type="number" class="edit-grams" min="0" step="1" value="${item.grams}" style="width:70px;padding:4px 8px;font-size:13px;">
        <span style="font-size:12px;color:#777;">g</span>
      </span>
      <span style="display:flex;gap:4px;">
        <button class="swap-btn edit-save" data-meal="${mealIdx}" data-slot="${slotIdx}">保存</button>
        <button class="swap-btn edit-cancel" data-meal="${mealIdx}" data-slot="${slotIdx}">取消</button>
      </span>
    </li>`;
  }
  return `<li>
    <span>
      <span class="meal-slot">${escapeHtml(item.slot)}</span>
      <span class="meal-food">${escapeHtml(item.food.name)}</span>${item.food && item.food.source === 'ai' ? '<span class="est-badge" title="本地成分表里没有这种食材，营养为 AI 估算，可能不准" style="font-size:11px;color:#b8860b;margin-left:5px;cursor:help;">估算</span>' : ''}
    </span>
    <span>
      <span class="meal-grams">${item.grams}g</span>
      <button class="swap-btn edit-btn" data-meal="${mealIdx}" data-slot="${slotIdx}">改</button>
      <button class="swap-btn delete-btn" data-meal="${mealIdx}" data-slot="${slotIdx}" style="color:#c0392b;">删</button>
    </span>
  </li>`;
}

let editingKey = null;  // "mealIdx-slotIdx" or null

function renderMeal(meal, mealIdx, totals, targets, profile) {
  const wrap = document.createElement('div');
  wrap.className = 'meal';
  const itemsHtml = meal.items.map((item, slotIdx) => {
    const isEditing = editingKey === `${mealIdx}-${slotIdx}`;
    return renderMealItem(item, mealIdx, slotIdx, isEditing);
  }).join('');
  // V4.7: 12 项全展开（之前只展示 KEY_NUTRIENTS 导致维C等不可见）
  const keyNutrients = NUTRIENTS.map(n => {
    const v = meal.nutrients[n.key];
    return `<span>${n.name} ${fmt(v, v < 10 ? 1 : 0)}${n.unit}</span>`;
  }).join('');
  // V5: 显示 AI 生成的菜名 + 做法步骤（如果有）
  const dishNameHtml = meal.dishName
    ? `<div class="dish-name">${escapeHtml(meal.dishName)}</div>`
    : '';
  const stepsHtml = (meal.steps && meal.steps.length > 0)
    ? `<div class="meal-instruction"><strong>做法:</strong><ol style="margin:4px 0 0;padding-left:20px;">${meal.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol></div>`
    : `<div class="meal-instruction">${escapeHtml(cookingNote(meal))}</div>`;
  const aiNoteHtml = meal.aiNote
    ? `<div class="muted" style="font-size:12px;margin-top:6px;">💡 ${escapeHtml(meal.aiNote)}</div>`
    : '';
  // V6.2: fallback 文案 + sanity warning 显示给用户
  const fallbackHtml = meal.fallbackReason
    ? `<div style="background:#fff8e1;border:1px solid #ffd54f;color:#7a5400;padding:8px 12px;border-radius:6px;margin:6px 0;font-size:12px;">⚠️ ${escapeHtml(meal.fallbackReason)}</div>`
    : '';
  const warningHtml = meal.aiWarning
    ? `<div style="background:#ffebee;border:1px solid #ef9a9a;color:#b71c1c;padding:8px 12px;border-radius:6px;margin:6px 0;font-size:12px;">⚠️ 营养数据可疑: ${escapeHtml(meal.aiWarning)} — 数值可能不准, 仅供参考。</div>`
    : '';
  // V7.2: 智能透明化 — 把后台的应季 + 食材轮换暴露给用户
  const intelligenceHtml = (meal.intelligence && meal.intelligence.length > 0)
    ? `<div style="background:#f0f9ff;border-left:3px solid #2c7a7b;padding:8px 12px;margin:8px 0;border-radius:4px;font-size:12px;color:#1a4747;line-height:1.6;">
         ${meal.intelligence.map(line => `<div>💡 ${escapeHtml(line)}</div>`).join('')}
       </div>`
    : '';
  // V7.4: 成品预期信号 — 让用户在「就吃这个」前对成品有合理预期
  // 减少"机会成本投入 → 失望"导致的 retention 流失
  const hasPreview = (meal.flavorTags && meal.flavorTags.length > 0) || meal.tastePreview || meal.prepMinutes;
  const previewHtml = (hasPreview && !meal.fallbackReason)
    ? (() => {
        const diffLabel = { 1: '新手可做', 2: '中等难度', 3: '需要经验' }[meal.difficulty] || '';
        const tagsLine = meal.flavorTags.length > 0
          ? `<div style="margin-bottom:4px;">🥢 ${meal.flavorTags.slice(0,5).map(t => `<span style="display:inline-block;background:#fff;border:1px solid #d4a574;color:#8b5a2b;padding:1px 8px;border-radius:10px;margin-right:4px;font-size:11px;">${escapeHtml(t)}</span>`).join('')}</div>`
          : '';
        const metaLine = (meal.prepMinutes || diffLabel)
          ? `<div style="font-size:12px;color:#7a5a3b;margin-bottom:6px;">🕐 ${meal.prepMinutes ? meal.prepMinutes + ' 分钟' : '时长未知'}${diffLabel ? ' · ' + diffLabel : ''}</div>`
          : '';
        const tasteLine = meal.tastePreview
          ? `<div style="font-size:13px;color:#5a3e1f;font-style:italic;line-height:1.5;">"${escapeHtml(meal.tastePreview)}"</div>`
          : '';
        return `<div style="background:#fef9f3;border:1px solid #f0d9b5;border-radius:6px;padding:10px 14px;margin:10px 0;">
          ${tagsLine}${metaLine}${tasteLine}
        </div>`;
      })()
    : '';
  // V7.3: 「就吃这个 ✓」按钮 — 用户决定的入口 + 修正反馈循环 signal
  // 不在 fallback 上显示 (基础版菜饭不是真菜饭, 没必要 "决定吃这个")
  const chooseBtnHtml = meal.fallbackReason
    ? ''
    : `<div style="margin:12px 0 4px;text-align:center;">
         <button class="btn-choose-meal" style="background:#2c7a7b;color:#fff;border:none;padding:12px 28px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500;">就吃这个 ✓</button>
         <div style="font-size:11px;color:#888;margin-top:6px;">明天会问你「昨天的 ${escapeHtml(meal.dishName || '菜')} 吃了吗」</div>
       </div>`;
  // V8.2 #1: 自动重试后仍存在的缺口, 安静诚实地标出来(不把"自动重试"偷换成"已达标全天营养")
  const _v = meal.validation;
  const gapHtml = (_v && !_v.ok && !meal.fallbackReason)
    ? `<div style="background:#f0f9ff;border-left:3px solid #2c7a7b;padding:7px 11px;margin:6px 0;border-radius:4px;font-size:12px;color:#1a4747;line-height:1.6;">${meal.retried ? '已自动换了更贴近的一版。' : ''}这一锅离全天目标还差一点（${_v.fails.map(escapeHtml).join('、')}）——不要紧，一锅本就难凑齐全天，今天其他餐或明天补上、或配杯酸奶＋一份水果就好。</div>`
    : '';
  wrap.innerHTML = `
    <div class="meal-head">
      <span class="meal-name">${escapeHtml(meal.name)}</span>
      <span class="meal-kcal">${fmt(meal.nutrients.kcal)} kcal · 蛋白 ${fmt(meal.nutrients.p, 1)}g</span>
    </div>
    ${dishNameHtml}
    ${fallbackHtml}
    ${warningHtml}
    ${gapHtml}
    ${intelligenceHtml}
    <ul class="meal-items">${itemsHtml}</ul>
    <!-- V6: 「+ 加食材」按钮默认藏起来, 多数用户不主动加; 改/删 hover 触发已经够用 -->
    ${previewHtml}
    ${chooseBtnHtml}
    ${stepsHtml}
    ${aiNoteHtml}
    <div class="meal-key-nutrients">${keyNutrients}</div>
  `;
  return wrap;
}

function renderDayTotals(dayTotals, targets) {
  const card = document.createElement('div');
  card.className = 'card day-totals';
  let html = '<h2>今日营养参考</h2><p style="font-size:12px;color:#888;margin:-2px 0 12px;line-height:1.7;">营养看一段时间的平均，不必每天每项都满。今天某项偏少很正常，一周大致均衡就好。</p><div class="nutrient-grid">';
  NUTRIENTS.forEach(n => {
    html += renderNutrientLine(n.key, dayTotals[n.key], targets[n.key]);
  });
  html += '</div>';
  card.innerHTML = html;
  return card;
}

function renderNutrientLine(key, cur, tgt) {
  const n = NUTRIENTS.find(x => x.key === key);
  const isLimit = n.type === 'limit';
  const pct = tgt > 0 ? (cur / tgt) * 100 : 0;
  // V8.4: 营养看一段时间的平均, 单日偏少不报红、不写"缺X%"(单日比 RDA 既不科学也制造焦虑)。
  // 热量/蛋白 大致每天该够 → 明显偏低才给温和提示; 其余(钙/铁/Omega-3/维D等) 按一周看 → 不报警。
  const DAILY_KEYS = ['kcal', 'p'];
  let barClass = '';
  let stateText = '';
  if (isLimit) {
    if (pct > 100) { barClass = 'over'; stateText = '⚠️ 偏高'; }
    else if (pct > 80) { barClass = 'warn'; stateText = '接近上限'; }
    else stateText = '✓';
  } else if (pct >= 95) {
    stateText = '✓';
  } else if (DAILY_KEYS.includes(key)) {
    barClass = pct < 60 ? 'warn' : '';
    stateText = pct < 80 ? '今天偏少' : '';
  } else {
    stateText = '看一周';
  }
  if (n.ul && cur > n.ul) { barClass = 'over'; stateText = '⚠️ 超上限'; }
  return `
    <div class="item">
      <div class="head">
        <span class="name">${n.name}</span>
        <span class="vals">${fmt(cur, cur < 10 ? 1 : 0)} / ${fmt(tgt, tgt < 10 ? 1 : 0)} ${n.unit} ${stateText}</span>
      </div>
      <div class="bar ${barClass}"><div style="width:${Math.min(100, Math.max(0, pct))}%"></div></div>
    </div>
  `;
}

// ====== V4.3 编辑食材 / 删除 / 加 ======
let currentResult = null;

function recalcDay() {
  NUTRIENTS.forEach(n => currentResult.dayTotals[n.key] = 0);
  currentResult.meals.forEach(m => {
    m.nutrients = computeMealNutrients(m);
    NUTRIENTS.forEach(n => currentResult.dayTotals[n.key] += m.nutrients[n.key]);
  });
}

function handleEditStart(mealIdx, slotIdx) {
  editingKey = `${mealIdx}-${slotIdx}`;
  renderOutput(currentResult, getProfileFromForm());
}

function handleEditCancel() {
  // V4.7 Bug #7 fix: 如果取消的是刚 "+加食材" 的空 placeholder, 把它从 meal 里删掉
  if (editingKey && currentResult) {
    const [mealIdx, slotIdx] = editingKey.split('-').map(Number);
    const meal = currentResult.meals[mealIdx];
    if (meal && meal.items[slotIdx] && !meal.items[slotIdx].food.name) {
      meal.items.splice(slotIdx, 1);
    }
  }
  editingKey = null;
  renderOutput(currentResult, getProfileFromForm());
}

function commitEdit(mealIdx, slotIdx, food, grams, isNewFood) {
  const meal = currentResult.meals[mealIdx];
  const item = meal.items[slotIdx];
  const fromName = item.food.name;
  const fromGrams = item.grams;
  item.food = food;
  item.grams = grams;
  recalcDay();
  logEvent(isNewFood ? 'edit_with_new_food' : 'edit', {
    mealIdx, slotIdx, slot: item.slot,
    fromFood: fromName, fromGrams, toFood: food.name, toGrams: grams
  });
  editingKey = null;
  renderOutput(currentResult, getProfileFromForm());
}

// V8.1 #2: 食材名→本地成分表。只用「全名精确」+「去括号基名精确相等」+人工 alias。
// 绝不做前缀/包含匹配 —— 防 鸡蛋清→鸡蛋、三文鱼油→三文鱼、牛奶粉→牛奶 这类静默错配。
function normFoodName(s) {
  // 统一括号宽度 + 去空格小写, 但保留 干/鲜/熟 等状态后缀(不再丢)
  return String(s || '').toLowerCase().replace(/（/g, '(').replace(/）/g, ')').replace(/\s+/g, '');
}
function baseFoodName(s) {
  // 取基名(去掉括号及之后): 菠菜(焯熟)→菠菜, 鸡腿肉(熟,去皮)→鸡腿肉
  return normFoodName(s).replace(/\(.*$/, '');
}
// 人工 alias: 同义词 / 干鲜状态 / 口语叫法 → 食物 id。只在这里加, 不做自动模糊。
const FOOD_ALIAS = {
  '剩米饭':'g-1', '米饭':'g-1', '白米饭':'g-1', '大米饭':'g-1',
  '香菇(干)':'s-47', '干香菇':'s-47', '香菇干':'s-47', '花菇':'s-47',
  '木耳':'s-16', '黑木耳':'s-16', '木耳(干)':'s-48', '干木耳':'s-48',
  '紫菜':'s-49', '紫菜(干)':'s-49', '干紫菜':'s-49', '海苔':'s-49',
  '西红柿':'s-5', '圣女果':'s-5', '小番茄':'s-5',
  '鸡腿':'m-4', '鸡腿肉':'m-4', '鸡胸':'m-3', '鸡胸肉':'m-3',
  '土豆丝':'s-13', '土豆片':'s-13', '马铃薯':'s-13', '洋芋':'s-13',
  '豆腐':'d-4', '老豆腐':'d-4', '北豆腐':'d-4', '嫩豆腐':'d-14', '南豆腐':'d-14',
  '圆白菜':'s-29', '卷心菜':'s-29', '包菜':'s-29',
};
function lookupFoodNutrition(name) {
  const q = normFoodName(name);
  if (!q) return null;
  // 0. 人工 alias (用 id, 不会因中文名细节而错)
  const aliasId = FOOD_ALIAS[q] || FOOD_ALIAS[baseFoodName(name)];
  if (aliasId) { const f = FOODS.find(x => x.id === aliasId); if (f) return f; }
  // 1. 全名精确(含状态): 香菇(干) 只配 香菇(干), 不会配到 香菇(鲜)
  let hits = FOODS.filter(f => normFoodName(f.name) === q);
  if (hits.length === 1) return hits[0];
  if (hits.length > 1) return null;
  // 2. 去括号基名「精确相等」(不是前缀!): 菠菜→菠菜(焯熟)。基名相同的多条→不确定→估算
  const qb = baseFoodName(name);
  if (qb.length >= 2) {
    hits = FOODS.filter(f => baseFoodName(f.name) === qb);
    if (hits.length === 1) return hits[0];
  }
  return null;
}

// V4.8: 模糊匹配 + 智能消歧 — 优先 startsWith；多个时返回 candidates 让 UI 展示
function resolveFoodSmart(foodName) {
  // 1. 精确
  let food = FOODS.find(f => f.name === foodName);
  if (food) return { food };
  // 2. 大小写不敏感精确
  food = FOODS.find(f => f.name.toLowerCase() === foodName.toLowerCase());
  if (food) return { food };
  // 3. 包含匹配
  const q = foodName.toLowerCase();
  const matches = FOODS.filter(f => f.name.toLowerCase().includes(q));
  if (matches.length === 0) return { matches: [] };
  if (matches.length === 1) return { food: matches[0] };
  // 4. 多匹配时：优先 startsWith 缩窄
  const startsWith = matches.filter(f => f.name.toLowerCase().startsWith(q));
  if (startsWith.length === 1) return { food: startsWith[0], autoChosen: true };
  // 5. 仍有多个 → 返回 candidates 让 UI 显示
  return { candidates: (startsWith.length > 0 ? startsWith : matches).slice(0, 6) };
}

function showInlinePicker(mealIdx, slotIdx, candidates, currentGrams) {
  const li = document.querySelector(`li[data-meal="${mealIdx}"][data-slot="${slotIdx}"]`);
  if (!li) return;
  // 移除已有 picker
  const existing = li.querySelector('.inline-picker');
  if (existing) existing.remove();
  const picker = document.createElement('div');
  picker.className = 'inline-picker';
  picker.style.cssText = 'margin-top:6px;padding:8px 10px;background:#fff8e6;border-radius:6px;font-size:12px;';
  picker.innerHTML = `<div style="color:#876700;margin-bottom:6px;">匹配多个，点一个选定：</div>` +
    candidates.map(f => `<button class="ghost picker-pick" data-food-id="${escapeHtml(f.id)}" style="margin:2px 4px 2px 0;font-size:12px;">${escapeHtml(f.name)}</button>`).join('');
  li.appendChild(picker);
  picker.querySelectorAll('.picker-pick').forEach(btn => {
    btn.addEventListener('click', () => {
      const food = FOODS.find(f => f.id === btn.dataset.foodId);
      if (food) commitEdit(mealIdx, slotIdx, food, currentGrams, false);
    });
  });
}

async function handleEditSave(mealIdx, slotIdx) {
  if (!currentResult) return;
  const li = document.querySelector(`li[data-meal="${mealIdx}"][data-slot="${slotIdx}"]`);
  if (!li) return;
  const foodName = li.querySelector('.edit-food').value.trim();
  const grams = parseFloat(li.querySelector('.edit-grams').value);
  if (!foodName) { alert('请填食物名'); return; }
  if (!grams || grams <= 0) { alert('请填克数'); return; }

  const res = resolveFoodSmart(foodName);
  if (res.food) {
    // 单一匹配（包括 autoChosen 自动从多个里选）
    commitEdit(mealIdx, slotIdx, res.food, grams, false);
    return;
  }
  if (res.candidates) {
    // V4.8: 多匹配 → 显示 inline picker，不 alert
    showInlinePicker(mealIdx, slotIdx, res.candidates, grams);
    return;
  }
  // 0 个匹配 → 库里没有 → 调 AI
  const saveBtn = li.querySelector('.edit-save');
  const originalText = saveBtn.textContent;
  saveBtn.textContent = '⏳ AI 查...';
  saveBtn.disabled = true;
  const aiData = await lookupFoodViaAI(foodName);
  saveBtn.textContent = originalText;
  saveBtn.disabled = false;
  logEvent('ai_lookup', { query: foodName, success: !aiData._error, error: aiData._error });
  showAddFoodModal(
    foodName,
    (newFood) => commitEdit(mealIdx, slotIdx, newFood, grams, true),
    aiData,
  );
}

function handleDelete(mealIdx, slotIdx) {
  if (!currentResult) return;
  const meal = currentResult.meals[mealIdx];
  const item = meal.items[slotIdx];
  if (!confirm(`从「${meal.name}」删除「${item.food.name}」?`)) return;
  logEvent('delete', { mealIdx, slotIdx, slot: item.slot, food: item.food.name, grams: item.grams });
  meal.items.splice(slotIdx, 1);
  recalcDay();
  editingKey = null;
  renderOutput(currentResult, getProfileFromForm());
}

// V4.6 P0: 保存今日记录到 V1 共享 storage
function saveDayToV1() {
  if (!currentResult || currentResult.meals.length === 0) {
    alert('先生成今日推荐再保存');
    return;
  }
  const today = new Date();
  const dateStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');
  const raw = localStorage.getItem(V1_STORAGE_KEY);
  const data = raw ? JSON.parse(raw) : {};
  data.logs = data.logs || {};
  const existing = data.logs[dateStr] || [];
  // Build entries from all meals
  const entries = [];
  const now = Date.now();
  currentResult.meals.forEach((meal, mealIdx) => {
    meal.items.forEach((item, slotIdx) => {
      if (!item.food || !item.food.id || !item.grams) return;
      entries.push({
        foodId: item.food.id,
        grams: +item.grams,
        ts: now + mealIdx * 100 + slotIdx,
        mealName: meal.name,  // 留作元信息
      });
    });
  });
  if (entries.length === 0) {
    alert('当前没有可保存的食物（推荐为空？）');
    return;
  }
  if (existing.length > 0) {
    if (!confirm(`今日（${dateStr}）V1 已有 ${existing.length} 条记录。\n\n确认 = 追加这 ${entries.length} 条（可能重复）\n取消 = 不保存`)) return;
  }
  data.logs[dateStr] = [...existing, ...entries];
  localStorage.setItem(V1_STORAGE_KEY, JSON.stringify(data));
  logEvent('save_day_to_v1', { date: dateStr, count: entries.length, totalAfter: data.logs[dateStr].length });
  // Show success
  alert(`✅ 已保存 ${entries.length} 条到 ${dateStr}。\n\n查历史: 打开 index.html → 今日记录 tab → 改日期能看每一天。`);
}

function handleAddItem(mealIdx) {
  if (!currentResult) return;
  const meal = currentResult.meals[mealIdx];
  // 加一个空 placeholder 项进 meal.items，然后进入编辑状态
  meal.items.push({ food: { name: '', kcal:0, p:0, fb:0, mg:0, k:0, ca:0, fe:0, zn:0, na:0, vc:0, vd:0, w3:0 }, grams: 0, slot: '加项' });
  const newSlotIdx = meal.items.length - 1;
  editingKey = `${mealIdx}-${newSlotIdx}`;
  logEvent('add_item_start', { mealIdx });
  renderOutput(currentResult, getProfileFromForm());
}

// ====== V8.3: 今日配餐补充 (一锅之外的固定动作, 把"单锅凑不齐全天"的边界讲清楚) ======
// 原则: 不算"精确缺口"(AI 数据有估算误差、吸收率不一), 只给低摩擦的日常动作 + 按周追踪。
const FISH_LOG_KEY = 'recommendToday_fishLog_v8';
const FISH_WEEK_TARGET = 2;
const FISH_RE = /鱼|虾|蟹|贝|蛤|蚝|牡蛎|鱿|墨鱼|海鲜|三文|金枪|鲈|鳕|带鱼|黄花|沙丁|鲐|鲫/;
function _weekStartStr() {
  const d = new Date();
  const sinceMon = (d.getDay() + 6) % 7;  // 周一=0
  d.setDate(d.getDate() - sinceMon);
  return localDateString(d);
}
function getFishLog() {
  try { return JSON.parse(localStorage.getItem(FISH_LOG_KEY) || '[]'); } catch (e) { return []; }
}
function fishThisWeek() {
  const ws = _weekStartStr();
  return getFishLog().filter(dt => dt >= ws).length;
}
function mealHasFish(meal) {
  // 只看食材(不看菜名), 避免"鱼香肉丝"这种无鱼却带"鱼"字的误判
  return !!meal && (meal.items || []).some(it => {
    const f = it.food || {};
    if (f.category === '水产') return true;
    const db = lookupFoodNutrition(f.name);
    if (db && db.category === '水产') return true;
    return FISH_RE.test(f.name || '');
  });
}
function recordFishIfAny(meals) {
  try {
    if (!(meals || []).some(mealHasFish)) return;
    const today = localDateString();
    const log = getFishLog();
    if (log[log.length - 1] === today) return;  // 同一天只记一次
    log.push(today);
    localStorage.setItem(FISH_LOG_KEY, JSON.stringify(log.slice(-40)));
  } catch (e) {}
}
// ====== V8.5: 后台动态营养调配 (无感) — 复杂留后台, 用户只拿到更均衡的下一锅 ======
// 原理: 记下每次"就吃这个"的当天营养 → 看最近7天 → 哪项持续偏低/钠偏高 → 下一锅的 AI 提示里悄悄多补。
// 汇总是纯加减法(不用 AI); 维 D 不参与(食物补不上, 交给晒太阳/医生)。
const NUTRI_LOG_KEY = 'recommendToday_nutriLog_v8';
// 能靠食物主动补的"摄入不足"项 → 对应富含食物(给 AI 当线索)。刻意不含维 D。
const FIXABLE_LOW = {
  p:  '蛋/瘦肉/鱼虾/豆制品',
  ca: '奶/酸奶/豆腐/黑芝麻/绿叶菜',
  fe: '瘦红肉/动物肝/蛤蜊/菠菜',
  zn: '牡蛎/瘦肉/坚果',
  fb: '全谷/豆类/菌菇/各种蔬菜',
  vc: '彩椒/西兰花/柑橘/猕猴桃',
};
function getNutritionLog() {
  try { return JSON.parse(localStorage.getItem(NUTRI_LOG_KEY) || '[]'); } catch (e) { return []; }
}
function recordNutritionChoice(result) {
  // 点"就吃这个"时, 把这餐 12 项营养存档(按天累加), 供后台按周调配
  try {
    const day = {};
    NUTRIENTS.forEach(n => day[n.key] = 0);
    (result.meals || []).forEach(m => NUTRIENTS.forEach(n => day[n.key] += (m.nutrients && m.nutrients[n.key]) || 0));
    const log = getNutritionLog();
    log.push({ date: localDateString(), n: day });
    localStorage.setItem(NUTRI_LOG_KEY, JSON.stringify(log.slice(-60)));
  } catch (e) {}
}
function nutritionWindow(days) {
  const d = new Date();
  d.setDate(d.getDate() - (days - 1));
  const cutoff = localDateString(d);
  const recent = getNutritionLog().filter(e => e.date >= cutoff);
  const sum = {};
  NUTRIENTS.forEach(n => sum[n.key] = 0);
  recent.forEach(e => NUTRIENTS.forEach(n => sum[n.key] += (e.n && e.n[n.key]) || 0));
  return { count: recent.length, sum };
}
// 后台调配: 最近7天持续偏低(可食补的)/钠持续偏高 → 返回给生成用; 数据太少不调(免得瞎调)
function balancingHints(perMealTargets) {
  const w = nutritionWindow(7);
  if (w.count < 3) return null;  // 至少 3 顿记录才动
  const low = [];
  Object.keys(FIXABLE_LOW).forEach(k => {
    const expect = (perMealTargets[k] || 0) * w.count;  // 这几顿若顿顿达标应有的量
    if (expect > 0 && w.sum[k] < expect * 0.6) low.push({ k, ratio: w.sum[k] / expect });
  });
  low.sort((a, b) => a.ratio - b.ratio);
  const pick = low.slice(0, 2).map(x => ({  // 最多盯 2 项, 别把菜搞得四不像
    name: NUTRIENTS.find(n => n.key === x.k).name,
    foods: FIXABLE_LOW[x.k],
  }));
  const naExpect = (perMealTargets.na || 0) * w.count;
  const highNa = naExpect > 0 && w.sum.na > naExpect * 1.2;
  if (pick.length === 0 && !highNa) return null;
  return { low: pick, highNa };
}

// ====== 主流程 ======
function renderOutput(result, profile) {
  const out = document.getElementById('output');
  out.innerHTML = '';
  // V4.7 Bug #6 fix: 每次 render 重建 datalist 让新加的食物能联想
  let dl = document.getElementById('food-list-v4');
  if (dl) dl.remove();
  dl = document.createElement('datalist');
  dl.id = 'food-list-v4';
  FOODS.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.name;
    opt.label = f.category;
    dl.appendChild(opt);
  });
  document.body.appendChild(dl);
  // Meals
  result.meals.forEach((meal, idx) => {
    out.appendChild(renderMeal(meal, idx, result.dayTotals, result.targets, profile));
  });
  // Day totals
  out.appendChild(renderDayTotals(result.dayTotals, result.targets));
  // V8.3: 今日配餐补充 (固定 奶+果 + 按周追踪吃鱼 + 维D方向提示)
  out.appendChild(renderSupplementCard());
  // V6: 砍了「保存今日」+「去 V1 看历史」— V4 是 outcome 工具不是 log 工具
  // 绑定按钮
  out.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => handleEditStart(+btn.dataset.meal, +btn.dataset.slot));
  });
  out.querySelectorAll('.edit-save').forEach(btn => {
    btn.addEventListener('click', () => handleEditSave(+btn.dataset.meal, +btn.dataset.slot));
  });
  out.querySelectorAll('.edit-cancel').forEach(btn => {
    btn.addEventListener('click', () => handleEditCancel());
  });
  out.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => handleDelete(+btn.dataset.meal, +btn.dataset.slot));
  });
  out.querySelectorAll('.add-item-btn').forEach(btn => {
    btn.addEventListener('click', () => handleAddItem(+btn.dataset.meal));
  });
  // V7.3: 「就吃这个 ✓」按钮 — 记 chosen + 改按钮文案
  out.querySelectorAll('.btn-choose-meal').forEach(btn => {
    btn.addEventListener('click', () => {
      markRecommendationAsChosen();
      recordFishIfAny(result.meals);  // V8.3: 选定含鱼的菜 → 记入本周吃鱼次数
      recordNutritionChoice(result);  // V8.5: 存档这餐营养, 供后台按周动态调配
      btn.textContent = '✓ 已选定 — 明天会问你';
      btn.style.background = '#9ca3af';
      btn.style.cursor = 'default';
      btn.disabled = true;
      // 也藏掉 "再换一组" — 决定了就别再换 (但保留, 不强藏 — 用户后悔可以再换)
    });
  });
  // 编辑中自动聚焦第一个 input
  if (editingKey) {
    const editInput = out.querySelector('li.editing .edit-food');
    if (editInput && !editInput.value) editInput.focus();
  }
  // Show regenerate button
  document.getElementById('btn-regenerate').style.display = 'inline-block';
}

// ====== V4.1 行为日志（silent，7 天后看数据）======
const LOG_KEY = 'recommendToday_eventLog_v4';
const LOG_CAP = 500;  // 防止 localStorage 爆

function logEvent(type, payload) {
  try {
    const events = getEventLog();
    events.push({ ts: Date.now(), type, ...payload });
    // 截断到 cap
    const trimmed = events.length > LOG_CAP ? events.slice(-LOG_CAP) : events;
    localStorage.setItem(LOG_KEY, JSON.stringify(trimmed));
  } catch (e) {}
}

function getEventLog() {
  try {
    const raw = localStorage.getItem(LOG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

// ====== V7 step 1: 反馈循环 (照吃了吗 / 没吃为什么) ======
// 不是新前端功能 — 是 step 2-6 (偏好画像/AI 排序) 的数据输入。没这个,后续学习全部空气。
const LAST_REC_KEY = 'recommendToday_lastRec_v7';
const FEEDBACK_KEY = 'recommendToday_feedback_v7';

function saveLastRecommendation(result, source) {
  try {
    const meal = result.meals[0];
    if (!meal || !meal.dishName) return;
    const today = localDateString();
    // V7.5 Bug A 修: auto 类不覆盖同日 chosen
    // 场景: 用户选了 A → 又点"再换一组" generate B (auto) → 之前 chosen 被冲掉
    // 防御: 写 auto 前 check, 如果同日已有 chosen, 保留之, 不覆盖
    if ((source || 'auto') === 'auto') {
      const existing = getLastRecommendation();
      if (existing && existing.source === 'chosen' && existing.date === today) {
        return;  // 不动 — 用户已选过的菜不被新 generate 抹掉
      }
    }
    const payload = {
      date: today,
      dishName: meal.dishName,
      items: meal.items.map(it => ({ name: it.food.name, grams: it.grams })),
      isFallback: !!meal.fallbackReason,
      source: source || 'auto',  // V7.3: 'auto' = 最后一次生成, 'chosen' = 用户明确选定
      ts: Date.now(),
    };
    localStorage.setItem(LAST_REC_KEY, JSON.stringify(payload));
  } catch (e) {}
}

// V7.3: 用户点 "就吃这个 ✓" 时调用 — 把当前推荐覆写为 chosen
// V7.4.1: 选定时才把食材加进 recent (轮换信号源), 修"幻觉"bug
// V7.5 Bug C: generates_before 现在能正确记录"这次 chose 之前 regenerate 了几次"
function markRecommendationAsChosen() {
  if (!currentResult || !currentResult.meals || !currentResult.meals[0]) return;
  const meal = currentResult.meals[0];
  saveLastRecommendation(currentResult, 'chosen');
  // 关键修复: 只在用户真选定时进 recent_ingredients, 不在每次 generate 时进
  if (!meal.fallbackReason) addRecentIngredients(meal);
  logEvent('choose', {
    dishName: meal.dishName,
    items: meal.items.map(it => ({ name: it.food.name, grams: it.grams })),
    isFallback: !!meal.fallbackReason,
    generates_before: generateClicks,
  });
  generateClicks = 0;  // V7.5: 下一个 "决策 session" 重新计数 (每次 chose 完为一个 session)
}

function getLastRecommendation() {
  try {
    const raw = localStorage.getItem(LAST_REC_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function getAllFeedback() {
  try {
    const raw = localStorage.getItem(FEEDBACK_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveFeedback(entry) {
  try {
    const all = getAllFeedback();
    all.push(entry);
    localStorage.setItem(FEEDBACK_KEY, JSON.stringify(all));
  } catch (e) {}
}

function hasFeedbackFor(date, dishName) {
  return getAllFeedback().some(f => f.date === date && f.dishName === dishName);
}

// 页面加载时检查: 是否有"上次推荐还没反馈"
function checkPendingFeedback() {
  const last = getLastRecommendation();
  if (!last) return;
  const today = localDateString();
  // 同一天打开不问 (用户刚生成的还没吃)
  if (last.date === today) return;
  // 反过 fallback 不算 (基础版菜饭, 不是真菜饭, 没必要采集反馈)
  if (last.isFallback) return;
  // 已答过不问
  if (hasFeedbackFor(last.date, last.dishName)) return;
  // V7.3: 只问用户明确选定的菜 (source=chosen), auto 类不打扰
  // 理由: 用户只是浏览没决定就强问反馈, 数据是噪音
  if (last.source !== 'chosen') return;
  showFeedbackModal(last);
}

    if (diffDays === 1) return '昨天';
    if (diffDays === 2) return '前天';
    return `${diffDays} 天前`;
  })();
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.2);">
      <h2 style="margin:0 0 6px;font-size:18px;">先问一下 ${dateLabel}的菜</h2>

      <p style="margin:0 0 8px;font-size:11px;color:#999;">(这是工具能不能学懂你的关键信号。答完才进入今天的推荐。)</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
        <button class="feedback-btn primary" data-ate="true" data-reason="ate" style="padding:12px;border:none;border-radius:6px;background:#2c7a7b;color:#fff;font-size:14px;cursor:pointer;">✓ 吃了 (或大部分照做了)</button>
        <div style="border-top:1px solid #eee;margin:6px 0;padding-top:8px;">
          <p style="margin:0 0 6px;font-size:12px;color:#888;">没吃的话 — 主要是因为:</p>
          <button class="feedback-btn ghost" data-ate="false" data-reason="cant_buy" style="display:block;width:100%;padding:10px;margin-bottom:6px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;text-align:left;">食材不好买 / 家里没有</button>
          <button class="feedback-btn ghost" data-ate="false" data-reason="cant_cook" style="display:block;width:100%;padding:10px;margin-bottom:6px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;text-align:left;">不会做 / 步骤不清楚</button>
          <button class="feedback-btn ghost" data-ate="false" data-reason="not_want" style="display:block;width:100%;padding:10px;margin-bottom:6px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;text-align:left;">不想吃 / 不像菜饭 / 看不上</button>
          <button class="feedback-btn ghost" data-ate="false" data-reason="too_much" style="display:block;width:100%;padding:10px;margin-bottom:6px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;text-align:left;">太麻烦 / 没时间做</button>
          <button class="feedback-btn ghost" data-ate="false" data-reason="other" style="display:block;width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;text-align:left;">别的 (在下面写一句)</button>
        </div>
      </div>
      <input type="text" id="feedback-note" placeholder="可选: 一句话补充, 比如「腊肠太咸」" style="display:none;width:100%;margin-top:10px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box;">
      <div style="margin-top:14px;text-align:right;">
        <button id="feedback-skip" style="background:none;border:none;color:#999;cursor:pointer;font-size:12px;text-decoration:underline;">跳过 (不算数据)</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  const noteInput = wrap.querySelector('#feedback-note');
  let pendingChoice = null;
  wrap.querySelectorAll('.feedback-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ate = btn.dataset.ate === 'true';
      const reason = btn.dataset.reason;
      pendingChoice = { ate, reason };
      if (!ate && reason === 'other') {
        noteInput.style.display = 'block';
        noteInput.focus();
        // 等用户敲回车或失焦才存
        const commit = () => {
          if (!pendingChoice) return;
          submitFeedback(last, pendingChoice.ate, pendingChoice.reason, noteInput.value || '');
          wrap.remove();

        noteInput.onkeydown = e => { if (e.key === 'Enter') commit(); };

    logEvent('feedback_skip', { for_date: last.date, dish: last.dishName });
    wrap.remove();
  });
}

function submitFeedback(last, ate, reason, note) {
  const entry = {
    date: last.date,
    dishName: last.dishName,
    items: last.items,
    ate,
    reason,
    note,
    ts: Date.now(),
  };
  saveFeedback(entry);
  logEvent('feedback', entry);
}

function summarizeMeal(meal) {
  return {
    name: meal.name,
    items: meal.items.map(it => ({ food: it.food.name, grams: it.grams, slot: it.slot })),
    kcal: Math.round(meal.nutrients.kcal),
    p: +meal.nutrients.p.toFixed(1),
  };
}

// 统计：从事件日志算几个有用数字
function computeLogStats() {
  const events = getEventLog();
  const stats = {
    totalEvents: events.length,
    generates: 0,
    regenerates: 0,
    swaps: 0,
    distinctDays: new Set(),
    swapsByFood: {},     // 哪些食材最常被换掉（from）
    pickedByFood: {},    // 哪些食材替换后被选中（to）
    swapsBySlot: {},     // 哪个 slot 最常换
    profileSnapshots: [],
  };
  events.forEach(e => {
    const day = localDateString(e.ts);
    stats.distinctDays.add(day);
    if (e.type === 'generate') {
      stats.generates++;
      if (e.profile) stats.profileSnapshots.push(e.profile);
    } else if (e.type === 'regenerate') {
      stats.regenerates++;
    } else if (e.type === 'edit' || e.type === 'edit_with_new_food') {
      stats.swaps++;
      if (e.fromFood) stats.swapsByFood[e.fromFood] = (stats.swapsByFood[e.fromFood] || 0) + 1;
      if (e.toFood) stats.pickedByFood[e.toFood] = (stats.pickedByFood[e.toFood] || 0) + 1;
      if (e.slot) stats.swapsBySlot[e.slot] = (stats.swapsBySlot[e.slot] || 0) + 1;
    }
  });
  stats.distinctDays = stats.distinctDays.size;
  return stats;
}

function topEntries(obj, n=5) {
  return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function renderStatsModal() {
  const stats = computeLogStats();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
  wrap.onclick = e => { if (e.target === wrap) wrap.remove(); };
  let html = `<div style="background:#fff;border-radius:10px;padding:24px 28px;max-width:680px;width:100%;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="margin:0;font-size:18px;">我的使用数据</h2>
      <button class="ghost" id="close-stats">关闭</button>
    </div>
    <p class="muted" style="font-size:13px;">仅本地，不上传。这是 7 天后你该看的东西——找出真实使用 pattern。</p>
    <h3>总览</h3>
    <ul style="margin:0;padding-left:20px;">
      <li>使用天数：${stats.distinctDays}</li>
      <li>生成次数（首次生成）：${stats.generates}</li>
      <li>"再换一组"次数：${stats.regenerates}（高 = 推荐质量差，你不满意）</li>
      <li>"换某食材"次数：${stats.swaps}（高 = 推荐 slot 准、单品不准）</li>
    </ul>`;
  if (stats.swaps > 0) {
    html += `<h3>最常被换掉的食材（推荐里的低质项）</h3><ul style="margin:0;padding-left:20px;">`;
    topEntries(stats.swapsByFood).forEach(([f, n]) => html += `<li>${escapeHtml(f)}: ${n} 次</li>`);
    html += `</ul>`;
    html += `<h3>替换后最常选中的食材（你真喜欢吃的）</h3><ul style="margin:0;padding-left:20px;">`;
    topEntries(stats.pickedByFood).forEach(([f, n]) => html += `<li>${escapeHtml(f)}: ${n} 次</li>`);
    html += `</ul>`;
    html += `<h3>最常被换的 slot（这个分类需要改推荐池）</h3><ul style="margin:0;padding-left:20px;">`;
    topEntries(stats.swapsBySlot).forEach(([s, n]) => html += `<li>${escapeHtml(s)}: ${n} 次</li>`);
    html += `</ul>`;
  } else {
    html += `<p class="muted">还没换过食材。多用几天再回来看。</p>`;
  }
  html += `<details style="margin-top:16px;"><summary>查看原始事件日志（最近 30 条）</summary>
    <pre style="background:#f5f6f8;padding:12px;border-radius:6px;font-size:11px;overflow-x:auto;max-height:300px;">${escapeHtml(JSON.stringify(getEventLog().slice(-30), null, 2))}</pre>
  </details>`;
  html += `<div style="margin-top:16px;text-align:right;">
    <button class="ghost" id="export-log" style="margin-right:8px;">导出 JSON</button>
    <button class="ghost" id="clear-log" style="color:#c0392b;border-color:#c0392b;">清空日志</button>
  </div>`;
  html += `</div>`;
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  document.getElementById('close-stats').onclick = () => wrap.remove();
  document.getElementById('export-log').onclick = () => {
    const blob = new Blob([JSON.stringify(getEventLog(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `今天吃什么_日志_${localDateString()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('clear-log').onclick = () => {
    if (!confirm('真的清空全部行为日志？无法恢复。')) return;
    localStorage.removeItem(LOG_KEY);
    wrap.remove();
  };
}
function fillForm(p) {
  if (!p) return;
  if (p.sex) document.getElementById('p-sex').value = p.sex;
  if (p.age) document.getElementById('p-age').value = p.age;
  if (p.weight) document.getElementById('p-weight').value = p.weight;
  if (p.height) document.getElementById('p-height').value = p.height;
  if (p.activity) document.getElementById('p-activity').value = p.activity;
  if (p.goal) document.getElementById('p-goal').value = p.goal;
  if (p.diet) document.getElementById('p-diet').value = p.diet;
  // V5.2: meals 字段废弃, 不再读
  if (p.pantry) document.getElementById('p-pantry').value = p.pantry.join(', ');
  if (p.dislikes) document.getElementById('p-dislikes').value = p.dislikes.join(', ');
}

// ====== Init ======
let generateClicks = 0;
async function generate(isRegen) {
  generateClicks++;  // V7.5 Bug C 修: 之前 counter 没累加, generates_before 永远是 0
  const profile = getProfileFromForm();
  saveProfile(profile);
  // V5: 显示 loading 状态; V6.1: disable 两个按钮防止并发点
  const btn = document.getElementById(isRegen ? 'btn-regenerate' : 'btn-generate');
  const btnOther = document.getElementById(isRegen ? 'btn-generate' : 'btn-regenerate');
  const orig = btn.textContent;
  btn.textContent = '⏳ AI 生成菜饭中... (约 5-15 秒)';
  btn.disabled = true;
  if (btnOther) btnOther.disabled = true;
  const out = document.getElementById('output');
  out.innerHTML = '<p class="muted" style="text-align:center;padding:32px;">⏳ AI 正在为你设计菜饭...</p>';
  try {
    currentResult = await generateDay(profile);
    logEvent(isRegen ? 'regenerate' : 'generate', {
      profile,
      meals: currentResult.meals.map(summarizeMeal),
      targetsKcal: currentResult.targets.kcal,
      dayKcal: Math.round(currentResult.dayTotals.kcal),
    });
    // V7 step 1: 记录最新推荐 (作为下次打开时反馈的标的)
    saveLastRecommendation(currentResult);
    renderOutput(currentResult, profile);
  } catch (e) {
    out.innerHTML = `<p style="color:#c0392b;padding:16px;">生成失败: ${escapeHtml(String(e))}</p>`;
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
    if (btnOther) btnOther.disabled = false;
  }
}

document.getElementById('btn-generate').addEventListener('click', () => generate(false));
document.getElementById('btn-regenerate').addEventListener('click', () => generate(true));

// V4.2: profile 变化时刷新 override placeholder（auto 值变了）
['p-sex','p-age','p-weight','p-height','p-activity','p-goal'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderOverrideGrid);
});

// V4.2: 全部恢复默认 override
document.getElementById('btn-reset-overrides').addEventListener('click', () => {
  const ov = getOverrides();
  if (Object.keys(ov).length === 0) { alert('当前没有自定义项'); return; }
  if (!confirm('清空所有自定义营养目标？V1 工具里的设置也会被清。')) return;
  setOverrides({});
  renderOverrideGrid();
});

// V6: 砍了底部「我的使用数据」link — 开发者 dashboard, 普通用户用不到
// (logEvent 等内部 logging 函数保留, 不删数据收集本身, 只删暴露入口)

// V4.4 把 V1 共享的自定义食物加进 FOODS
loadCustomFoodsIntoFoods();

// V7.5 Bug B 修: 清老用户脏数据 (一次性, 幂等)
migrateRecentIngredientsV741();

// 加载已存档案
fillForm(loadProfile());

// V4.2 渲染 override 区
renderOverrideGrid();

// V4.1 记录首次打开
logEvent('open', { profile: loadProfile() });

// V7 step 1: 如果有上次推荐 + 不是今天 + 还没反馈过, 弹反馈框 (异步, 不阻塞)
setTimeout(checkPendingFeedback, 300);

</script>
