<!DOCTYPE html>
<html lang="zh-Hans" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f4efe6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="一锅出" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>一锅出</title>
  <style>
    :root {
      --paper: #f4efe6;
      --card: #fffaf4;
      --ink: #1b1612;
      --ink-2: #4e453d;
      --line: rgba(27, 22, 18, 0.1);
      --clay: #c24b1a;
      --clay-deep: #8a3112;
      --wash: #f0c4a4;
      --display: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "Songti TC", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
      font-family: var(--sans);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      background-image:
        radial-gradient(120% 60% at 0% -10%, rgba(255, 250, 244, 0.9), transparent 50%),
        radial-gradient(80% 40% at 100% 0%, rgba(194, 75, 26, 0.06), transparent 46%);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }
    #browse, #detail { max-width: 480px; margin: 0 auto; }
    .top {
      padding: calc(18px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    }
    .brand {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2em;
      line-height: 1.2;
    }
    .week { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.4; }
    #pin-section {
      padding: 22px max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    }
    .pin-label {
      margin: 0 0 12px;
      color: var(--clay-deep);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.18em;
    }
    #pins { display: grid; gap: 4px; }
    .find {
      position: sticky;
      top: env(safe-area-inset-top);
      z-index: 5;
      margin-top: 18px;
      padding: 12px max(20px, env(safe-area-inset-right)) 8px max(20px, env(safe-area-inset-left));
      background: rgba(244, 239, 230, 0.94);
    }
    .filters {
      display: flex; flex-wrap: wrap; align-content: flex-start;
      gap: 8px; width: 100%; overflow: visible;
    }
    .filters button {
      flex: 0 0 auto; white-space: nowrap;
      min-height: 44px; border: 1px solid transparent; background: rgba(27, 22, 18, 0.05);
      border-radius: 999px; padding: 0 14px; font-size: 15px;
    }
    .filters button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .search { position: relative; display: block; margin-top: 10px; }
    .search input {
      width: 100%; min-height: 48px; font-size: 16px;
      border: 0; border-radius: 16px; padding: 0 48px 0 16px;
      background: var(--card); outline: none;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .search input::placeholder { color: #6f655c; }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    #clear {
      position: absolute; right: 2px; top: 2px;
      width: 44px; height: 44px; border: 0; border-radius: 12px;
      background: transparent; color: var(--ink); font-size: 22px; line-height: 1;
    }
    main {
      padding: 4px max(20px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    #list, #folded { display: grid; }
    .card-row {
      display: block; width: 100%; text-align: left;
      background: transparent; border: 0; border-radius: 0;
      padding: 14px 2px 13px; min-height: 52px;
      box-shadow: inset 0 -1px 0 var(--line);
    }
    .card-row:active { opacity: 0.64; }
    .card-row.primary {
      background: var(--wash);
      border-radius: 30px;
      min-height: 168px;
      padding: 26px 22px 22px;
      box-shadow: 0 18px 40px rgba(156, 64, 24, 0.14);
    }
    .card-row.secondary {
      background: transparent;
      border-radius: 0;
      min-height: 64px;
      padding: 14px 6px 12px 8px;
      box-shadow: none;
    }
    .title-row { display: flex; align-items: baseline; gap: 10px; }
    .card-row h3 {
      margin: 0; flex: 1; min-width: 0;
      font-size: 18px; line-height: 1.35; font-weight: 650;
    }
    .card-row.primary h3 {
      font-family: var(--display);
      font-size: 34px; line-height: 1.16; font-weight: 700; letter-spacing: -0.03em;
    }
    .card-row.secondary .title-row { justify-content: flex-start; }
    .card-row.secondary h3 { flex: 0 1 auto; font-size: 18px; font-weight: 650; }
    .also {
      flex: none; font-size: 14px; font-weight: 650; line-height: 1;
      color: var(--clay); letter-spacing: 0.08em; background: none; padding: 0;
    }
    .meta { margin: 3px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.4; }
    .card-row.primary .meta { margin-top: 10px; color: #3d2c24; font-size: 15px; }
    .why {
      margin: 16px 0 0; color: var(--clay-deep);
      font-size: 17px; line-height: 1.45; font-weight: 650;
    }
    .mark {
      flex: none; margin: 0; padding: 0; background: none;
      color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.2;
    }
    .more {
      min-height: 52px; width: 100%; margin-top: 4px;
      display: flex; align-items: center; justify-content: space-between;
      border: 0; background: transparent; padding: 0 2px;
      font-size: 16px; font-weight: 650; text-align: left;
    }
    .chev {
      width: 8px; height: 8px; margin-top: -4px; flex: none;
      border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
    }
    .more[aria-expanded="true"] .chev,
    .who-toggle[aria-expanded="true"] .chev { transform: rotate(-135deg); margin-top: 4px; }
    .empty, .err { margin: 22px 0 0; font-size: 17px; line-height: 1.45; }
    .detail-bar {
      position: sticky; top: 0; z-index: 4;
      padding: calc(2px + env(safe-area-inset-top)) 8px 0;
      background: linear-gradient(var(--paper) 70%, rgba(244, 239, 230, 0));
    }
    .back {
      min-height: 44px; min-width: 44px; border: 0; background: transparent;
      padding: 0 12px; font-size: 16px; font-weight: 650;
    }
    .sheet {
      padding: 2px max(20px, env(safe-area-inset-right)) calc(148px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    .sheet h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 40px; line-height: 1.14; font-weight: 700; letter-spacing: -0.03em;
    }
    .sheet .meta { margin: 8px 0 0; color: var(--ink); font-size: 16px; }
    .pack {
      margin: 4px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .portion { margin: 8px 0 0; font-size: 16px; line-height: 1.45; }
    .kicker {
      margin: 20px 0 6px;
      font-size: 13px; font-weight: 650; letter-spacing: 0.16em; color: var(--ink-2);
    }
    .ings { list-style: none; margin: 0; padding: 0; }
    .ings li { margin: 0; padding: 3px 0; font-size: 16px; line-height: 1.45; }
    #steps { margin-top: 2px; }
    .step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 12px 0 14px; }
    .num {
      font-family: var(--display);
      font-size: 28px; line-height: 1; font-weight: 700; color: var(--clay); padding-top: 1px;
    }
    .step .text { font-size: 19px; line-height: 1.6; }
    .who-toggle {
      width: 100%; min-height: 48px; margin-top: 18px;
      display: flex; align-items: center; justify-content: space-between;
      border: 0; background: transparent; padding: 0 2px;
      font-size: 16px; font-weight: 650; text-align: left;
    }
    .who-side { display: flex; align-items: center; gap: 10px; }
    #who-now:not(:empty) { color: var(--clay-deep); font-weight: 650; }
    .who { display: flex; gap: 8px; padding: 4px 0 8px; }
    .who button {
      flex: 1; min-height: 44px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card);
      font-size: 15px; font-weight: 650;
    }
    .who button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .log { margin-top: 8px; }
    .log-label { margin: 0 0 2px; color: var(--ink-2); font-size: 13px; font-weight: 650; letter-spacing: 0.12em; }
    .log ul { list-style: none; margin: 0; padding: 0; }
    .log li { padding: 9px 0; font-size: 15px; line-height: 1.4; }
    .actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
      display: flex; gap: 10px;
      max-width: 480px; margin: 0 auto;
      padding: 14px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--paper);
    }
    .actions::before {
      content: "";
      position: absolute; left: 0; right: 0; top: -22px; height: 22px;
      background: linear-gradient(to bottom, rgba(244, 239, 230, 0), var(--paper));
      pointer-events: none;
    }
    .actions button {
      flex: 1; min-height: 56px; border-radius: 18px;
      font-size: 18px; font-weight: 700;
    }
    .btn-eat { background: var(--clay); color: #fffaf4; border: 0; }
    .btn-left { background: transparent; color: var(--ink); border: 1.5px solid rgba(27, 22, 18, 0.28); }
    .btn-eat:active, .btn-left:active { opacity: 0.78; }
    .btn-eat.chosen { background: var(--clay-deep); }
    .btn-left.chosen { background: var(--ink); color: #fffaf4; border-color: var(--ink); }
    .actions.picked .btn-eat:not(.chosen) {
      background: transparent; color: var(--clay); border: 1.5px solid var(--clay);
    }
  </style>
</head>
<body>
  <div id="browse">
    <header class="top">
      <p class="brand">一锅出</p>
      <p id="week" class="week" hidden></p>
    </header>
    <section id="pin-section" hidden>
      <h2 class="pin-label">本周待试</h2>
      <div id="pins"></div>
    </section>
    <div class="find">
      <div class="filters" id="filters" role="toolbar" aria-label="形态"></div>
      <label class="search">
        <span class="sr">搜索</span>
        <input id="q" type="search" enterkeyhint="search" placeholder="菜名、食材" autocomplete="off" autocapitalize="off" />
        <button type="button" id="clear" hidden aria-label="清空">×</button>
      </label>
    </div>
    <main>
      <div id="list"></div>
      <button type="button" class="more" id="more" hidden></button>
      <div id="folded" hidden></div>
      <p id="empty" class="empty" hidden>没有这道菜。</p>
      <p id="err" class="err" hidden></p>
    </main>
  </div>
  <article id="detail" hidden></article>
  <script>
    const FORM_RANK = { "汤泡饭": 0, "菜饭": 1, "焖饭": 2, "咖喱一锅": 3, "其他一锅": 4, "手抓饭": 5, "煲类一锅": 6 };
    const FORM_ORDER = ["汤泡饭", "菜饭", "焖饭", "咖喱一锅", "其他一锅", "手抓饭", "煲类一锅"];
    const SHELF_FORMS = new Set(["汤泡饭", "菜饭", "焖饭"]);
    const PIN_ORDER = ["baicai-doufu-menfan", "roumi-qingcai-fan"];
    const FB_KEY = "yiguochu-recipe-library-feedback-v1";
    const LOG_KEY = "yiguochu-recipe-library-log-v1";
    const WHO = ["女儿", "本人", "全家"];
    const UI_KEY = "yiguochu-browse-ui-v1";
    const COLLATOR = new Intl.Collator("zh-Hans");
    const LIBRARY_FAIL = "菜谱库没打开。用刚才那个地址再开一次。";
    const CARD_FAIL = "这道菜没打开。返回再点一次。";
    const EMPTY = "没有这道菜。";

    let cards = [];
    let pinMeta = [];
    let query = "";
    let activeForm = "全部";
    let othersOpen = false;
    let restoreY = 0;
    let openToken = 0;

    const $browse = document.getElementById("browse");
    const $detail = document.getElementById("detail");
    const $filters = document.getElementById("filters");
    const $pins = document.getElementById("pins");
    const $pinSection = document.getElementById("pin-section");
    const $list = document.getElementById("list");
    const $more = document.getElementById("more");
    const $folded = document.getElementById("folded");
    const $empty = document.getElementById("empty");
    const $err = document.getElementById("err");
    const $q = document.getElementById("q");
    const $clear = document.getElementById("clear");
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }
    function today() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    }
    function loadFeedback() {
      try { return JSON.parse(localStorage.getItem(FB_KEY) || "{}"); }
      catch { return {}; }
    }
    function saveFeedback(map) {
      localStorage.setItem(FB_KEY, JSON.stringify(map));
    }
    function addDays(dayStr, n) {
      const [y, m, d] = dayStr.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d) + n * 86400000).toISOString().slice(0, 10);
    }
    function weekStart(dayStr) {
      const [y, m, d] = dayStr.split("-").map(Number);
      const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
      return addDays(dayStr, wd === 0 ? -6 : 1 - wd);
    }
    function inThisWeek(dayStr) {
      const start = weekStart(today());
      return dayStr >= start && dayStr <= addDays(start, 6);
    }
    function inLast14(dayStr) {
      return dayStr >= addDays(today(), -13) && dayStr <= today();
    }
    function loadLog() {
      try {
        const raw = JSON.parse(localStorage.getItem(LOG_KEY) || "null");
        return Array.isArray(raw) ? raw : null;
      } catch { return null; }
    }
    function saveLog(rows) {
      localStorage.setItem(LOG_KEY, JSON.stringify(rows));
    }
    function ensureLog() {
      const existing = loadLog();
      if (existing) return existing;
      const seeded = [];
      Object.entries(loadFeedback()).forEach(([id, row]) => {
        if (!row || (row.result !== "吃光" && row.result !== "剩了") || !row.day) return;
        seeded.push({ id, name: "", day: row.day, result: row.result, who: row.who || "" });
      });
      saveLog(seeded);
      return seeded;
    }
    function upsertLog(entry) {
      const rows = ensureLog().filter((row) => !(row.id === entry.id && row.day === entry.day));
      rows.push({ id: entry.id, name: entry.name || "", day: entry.day, result: entry.result, who: entry.who || "" });
      const cutoff = addDays(today(), -60);
      saveLog(rows.filter((row) => row.day >= cutoff).slice(-200));
    }
    function removeLog(id, day) {
      saveLog(ensureLog().filter((row) => !(row.id === id && row.day === day)));
    }
    function weekCounts() {
      const rows = ensureLog().filter((row) => inThisWeek(row.day));
      return {
        ate: rows.filter((row) => row.result === "吃光").length,
        left: rows.filter((row) => row.result === "剩了").length
      };
    }
    function paintWeek() {
      const $week = document.getElementById("week");
      const counts = weekCounts();
      if (!counts.ate && !counts.left) {
        $week.hidden = true;
        $week.textContent = "";
        return;
      }
      $week.hidden = false;
      $week.textContent = `本周 吃光 ${counts.ate} · 剩了 ${counts.left}`;
    }
    function loggedToday(id) {
      const row = loadFeedback()[id];
      return !!(row && row.day === today() && (row.result === "吃光" || row.result === "剩了"));
    }
    function isDirty(line) {
      const s = String(line ?? "");
      return s.includes("{'ru'") || s.includes('{"ru"') || s.includes("要点对照来源")
        || s.includes("preview_ready") || s.includes("docs/")
        || s.includes("start.command") || s.includes("serve.command")
        || s.includes("http://") || s.includes("https://");
    }
    function cleanLines(list) {
      return (list || []).map((x) => String(x).trim()).filter((x) => x && !isDirty(x));
    }
    function ingredientBlob(card) {
      const lines = Array.isArray(card.ingredients) ? card.ingredients : [];
      return lines.join("\n");
    }
    function shelfKey(card) {
      const time = Number(card.time_total);
      const bucket = time <= 45 ? 0 : 1;
      const pack = card.packable ? 0 : 1;
      return [bucket, FORM_RANK[card.form], pack, time];
    }
    function byShelf(a, b) {
      const ka = shelfKey(a);
      const kb = shelfKey(b);
      for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
      const name = COLLATOR.compare(a.name, b.name);
      if (name) return name;
      return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    }
    function bySearch(a, b) {
      const q = query.trim().toLowerCase();
      const rank = (card) => {
        const name = String(card.name || "").toLowerCase();
        return [(name.startsWith(q) ? 0 : 1), (name.includes(q) ? 0 : 1)];
      };
      const ra = rank(a);
      const rb = rank(b);
      if (ra[0] !== rb[0]) return ra[0] - rb[0];
      if (ra[1] !== rb[1]) return ra[1] - rb[1];
      return byShelf(a, b);
    }
    function matchesQuery(card) {
      const q = query.trim().toLowerCase();
      if (!q) return true;
      const blob = [card.name, card.form, ingredientBlob(card)].join("\n").toLowerCase();
      return q.split(/\s+/).filter(Boolean).every((token) => blob.includes(token));
    }
    function matchesForm(card) {
      return activeForm === "全部" || card.form === activeForm;
    }
    function foldedMode() {
      return !query.trim() && activeForm === "全部";
    }
    function activePinIds() {
      return PIN_ORDER.filter((id) => pinMeta.some((p) => p.id === id) && !loggedToday(id));
    }
    function pinInfo(id) {
      return pinMeta.find((p) => p.id === id) || null;
    }
    function todayResult(id) {
      const row = loadFeedback()[id];
      if (!row || row.day !== today()) return "";
      return row.result === "吃光" || row.result === "剩了" ? row.result : "";
    }
    function metaLine(card) {
      const pack = card.packable ? "可打包" : "不打包";
      const time = card.time_total != null ? `${card.time_total} 分钟` : "";
      return `${escapeHtml(card.form)} · ${escapeHtml(time)} · ${pack}`;
    }
    function cardButton(card, role) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card-row " + (role === "primary" ? "primary" : role === "secondary" ? "secondary" : "shelf");
      btn.dataset.id = card.id;
      const info = pinInfo(card.id);
      const also = role === "secondary" ? `<span class="also">也可</span>` : "";
      const why = role === "primary" && info && info.why ? `<p class="why">${escapeHtml(info.why)}</p>` : "";
      const mark = todayResult(card.id);
      const markHtml = mark ? `<span class="mark ${mark === "吃光" ? "ate" : "left"}">${escapeHtml(mark)}</span>` : "";
      btn.innerHTML = `<div class="title-row"><h3>${escapeHtml(card.name)}</h3>${also}${markHtml}</div><p class="meta">${metaLine(card)}</p>${why}`;
      btn.addEventListener("click", () => openCard(card.id, true));
      return btn;
    }
    function paintClear() {
      $clear.hidden = !query.trim();
    }
    function onQuery() {
      query = $q.value;
      othersOpen = false;
      renderFilters();
      renderList();
      window.scrollTo(0, 0);
      remember();
      paintClear();
    }
    function remember() {
      sessionStorage.setItem(UI_KEY, JSON.stringify({
        q: query, form: activeForm, y: window.scrollY, othersOpen
      }));
    }
    function renderFilters() {
      const counts = { "全部": 0 };
      cards.forEach((card) => {
        if (!matchesQuery(card)) return;
        counts["全部"] += 1;
        counts[card.form] = (counts[card.form] || 0) + 1;
      });
      if (activeForm !== "全部" && !counts[activeForm]) activeForm = "全部";
      $filters.innerHTML = "";
      const forms = ["全部"].concat(FORM_ORDER.filter((form) => counts[form]));
      forms.forEach((form) => {
        const b = document.createElement("button");
        b.type = "button";
        const n = form === "全部" ? counts["全部"] : counts[form];
        b.textContent = `${form} ${n}`;
        b.setAttribute("aria-pressed", form === activeForm ? "true" : "false");
        b.addEventListener("click", () => {
          activeForm = form;
          othersOpen = false;
          renderFilters();
          renderList();
          window.scrollTo(0, 0);
          remember();
        });
        $filters.appendChild(b);
      });
    }
    function renderList() {
      $err.hidden = true;
      const byId = new Map(cards.map((c) => [c.id, c]));
      const pinIds = new Set(PIN_ORDER);
      const shownPins = activePinIds()
        .map((id) => byId.get(id))
        .filter((card) => card && matchesQuery(card) && matchesForm(card));
      const rest = cards.filter((card) => !pinIds.has(card.id) || loggedToday(card.id));
      const hits = rest.filter((card) => matchesQuery(card) && matchesForm(card));
      $pins.innerHTML = "";
      $list.innerHTML = "";
      $folded.innerHTML = "";
      $pinSection.hidden = shownPins.length === 0;
      shownPins.forEach((card, index) => {
        $pins.appendChild(cardButton(card, index === 0 ? "primary" : "secondary"));
      });
      if (foldedMode()) {
        const shelf = hits.filter((card) => card.time_total <= 45 && card.packable && SHELF_FORMS.has(card.form)).sort(byShelf);
        const others = hits.filter((card) => !shelf.includes(card)).sort(byShelf);
        shelf.forEach((card) => $list.appendChild(cardButton(card, "shelf")));
        $more.hidden = others.length === 0;
        $more.setAttribute("aria-expanded", othersOpen ? "true" : "false");
        $more.innerHTML = `<span>其他菜 ${others.length}</span><span class="chev" aria-hidden="true"></span>`;
        $folded.hidden = !othersOpen;
        if (othersOpen) others.forEach((card) => $folded.appendChild(cardButton(card, "shelf")));
        $empty.hidden = shownPins.length + shelf.length + others.length !== 0;
      } else {
        hits.sort(bySearch);
        hits.forEach((card) => $list.appendChild(cardButton(card, "shelf")));
        $more.hidden = true;
        $folded.hidden = true;
        $empty.hidden = shownPins.length + hits.length !== 0;
      }
      $empty.textContent = EMPTY;
      paintWeek();
    }
    function showError(msg) {
      $err.hidden = false;
      $err.textContent = msg;
    }
    function showBrowse() {
      $detail.hidden = true;
      $detail.innerHTML = "";
      $browse.hidden = false;
      renderFilters();
      renderList();
      const y = restoreY;
      restoreY = 0;
      paintClear();
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
    async function openCard(id, push) {
      const token = ++openToken;
      remember();
      try {
        const res = await fetch("./cards/" + encodeURIComponent(id) + ".json");
        if (!res.ok) throw new Error("fail");
        const card = await res.json();
        if (token !== openToken) return;
        paintDetail(card);
        $browse.hidden = true;
        $detail.hidden = false;
        window.scrollTo(0, 0);
        if (push && location.hash !== "#" + id) history.pushState({ detail: id }, "", "#" + id);
      } catch {
        if (token !== openToken) return;
        showBrowse();
        showError(CARD_FAIL);
      }
    }
    function paintDetail(card) {
      const tm = card.time_minutes || {};
      const total = tm.total != null ? tm.total : card.time_total;
      const pack = card.packable ? "可打包" : "不打包";
      const rawPack = card.pack_notes && !isDirty(card.pack_notes) ? String(card.pack_notes).trim() : "";
      const packNote = rawPack ? rawPack.split(/[。！？]/)[0].trim() : "";
      const summary = card.servings && card.servings.summary && !isDirty(card.servings.summary)
        ? card.servings.summary : "";
      const ingredients = cleanLines(card.ingredients);
      const steps = cleanLines(card.steps_now);
      $detail.innerHTML = `
        <div class="detail-bar"><button type="button" class="back" id="back">返回</button></div>
        <div class="sheet">
          <h2>${escapeHtml(card.name)}</h2>
          <p class="meta">${escapeHtml(card.form)} · ${escapeHtml(total)} 分钟 · ${pack}</p>
          ${packNote ? `<p class="pack">${escapeHtml(packNote)}</p>` : ""}
          ${summary ? `<p class="portion">${escapeHtml(summary)}</p>` : ""}
          ${ingredients.length ? `<h3 class="kicker">食材</h3><ul class="ings">${ingredients.map((line) => `<li>${escapeHtml(line)}</li>`).join("")}</ul>` : ""}
          ${steps.length ? `<h3 class="kicker">现在动手</h3><div id="steps">${steps.map((line, i) => `<div class="step"${i === 0 ? ' id="step-1"' : ""}><span class="num">${i + 1}</span><span class="text">${escapeHtml(line)}</span></div>`).join("")}</div>` : ""}
          <button type="button" class="who-toggle" id="who-toggle" aria-expanded="false" aria-controls="who-panel">
            <span>谁吃了</span>
            <span class="who-side"><span id="who-now"></span><span class="chev" aria-hidden="true"></span></span>
          </button>
          <div id="who-panel" hidden>
            <div class="who" role="group" aria-label="谁吃">
              ${WHO.map((who) => `<button type="button" data-who="${who}">${who}</button>`).join("")}
            </div>
            <div id="dish-log"></div>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn-eat" data-result="吃光">吃光</button>
          <button type="button" class="btn-left" data-result="剩了">剩了</button>
        </div>`;
      let draftWho = "";
      function savedToday() {
        const row = loadFeedback()[card.id];
        return row && row.day === today() ? row : null;
      }
      function paintChosen() {
        const row = loadFeedback()[card.id];
        const picked = !!(row && row.day === today() && (row.result === "吃光" || row.result === "剩了"));
        $detail.querySelector(".actions").classList.toggle("picked", picked);
        $detail.querySelectorAll("[data-result]").forEach((btn) => {
          const on = !!(row && row.day === today() && row.result === btn.dataset.result);
          btn.classList.toggle("chosen", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      function paintWho() {
        const row = savedToday();
        const who = row && row.who ? row.who : draftWho;
        $detail.querySelectorAll("[data-who]").forEach((btn) => {
          btn.setAttribute("aria-pressed", btn.dataset.who === who ? "true" : "false");
        });
        const now = document.getElementById("who-now");
        if (now) now.textContent = who || "";
      }
      function paintDishLog() {
        const lines = ensureLog()
          .filter((row) => row.id === card.id && inLast14(row.day))
          .sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : 0));
        const box = document.getElementById("dish-log");
        if (!lines.length) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = `<div class="log"><p class="log-label">近两周</p><ul>${lines.map((row) => {
          const who = row.who ? ` · ${escapeHtml(row.who)}` : "";
          return `<li>${escapeHtml(row.day.slice(5))} ${escapeHtml(row.result)}${who}</li>`;
        }).join("")}</ul></div>`;
      }
      paintChosen();
      paintWho();
      paintDishLog();
      document.getElementById("back").addEventListener("click", () => {
        const snap = JSON.parse(sessionStorage.getItem(UI_KEY) || "{}");
        query = snap.q || "";
        activeForm = snap.form || "全部";
        othersOpen = !!snap.othersOpen;
        restoreY = Number(snap.y) || 0;
        $q.value = query;
        if (location.hash) history.back();
        else showBrowse();
      });
      document.getElementById("who-toggle").addEventListener("click", () => {
        const panel = document.getElementById("who-panel");
        const open = panel.hidden;
        panel.hidden = !open;
        document.getElementById("who-toggle").setAttribute("aria-expanded", open ? "true" : "false");
      });
      $detail.querySelectorAll("[data-who]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const who = btn.dataset.who;
          const map = loadFeedback();
          const row = map[card.id];
          if (row && row.day === today()) {
            row.who = row.who === who ? "" : who;
            draftWho = row.who;
            saveFeedback(map);
            upsertLog({ id: card.id, name: card.name, day: row.day, result: row.result, who: row.who });
          } else {
            draftWho = draftWho === who ? "" : who;
          }
          paintWho();
          paintDishLog();
        });
      });
      $detail.querySelectorAll("[data-result]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const map = loadFeedback();
          const day = today();
          const prev = map[card.id];
          if (prev && prev.day === day && prev.result === btn.dataset.result) {
            delete map[card.id];
            draftWho = "";
            saveFeedback(map);
            removeLog(card.id, day);
          } else {
            const who = (prev && prev.day === day && prev.who) || draftWho || "";
            map[card.id] = who ? { result: btn.dataset.result, day, who } : { result: btn.dataset.result, day };
            draftWho = who;
            saveFeedback(map);
            upsertLog({ id: card.id, name: card.name, day, result: btn.dataset.result, who });
          }
          paintChosen();
          paintWho();
          paintDishLog();
          renderList();
        });
      });
    }
    $more.addEventListener("click", () => {
      othersOpen = !othersOpen;
      renderList();
      remember();
    });
    $q.addEventListener("input", onQuery);
    $q.addEventListener("search", onQuery);
    $clear.addEventListener("click", () => {
      $q.value = "";
      $q.focus();
      onQuery();
    });
    window.addEventListener("popstate", () => {
      const id = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (id) openCard(id, false);
      else {
        const snap = JSON.parse(sessionStorage.getItem(UI_KEY) || "{}");
        query = snap.q || query;
        activeForm = snap.form || activeForm;
        othersOpen = snap.othersOpen != null ? !!snap.othersOpen : othersOpen;
        restoreY = Number(snap.y) || 0;
        $q.value = query;
        showBrowse();
      }
    });
    async function boot() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(UI_KEY) || "{}");
        if (saved && typeof saved === "object") {
          query = saved.q || "";
          activeForm = saved.form || "全部";
          othersOpen = !!saved.othersOpen;
          restoreY = Number(saved.y) || 0;
          $q.value = query;
        }
      } catch { /* 没有上次位置 */ }
      try {
        const res = await fetch("./index.json");
        if (!res.ok) throw new Error("fail");
        const data = await res.json();
        cards = data.cards || [];
        pinMeta = Array.isArray(data.weekly_pins) ? data.weekly_pins : [];
        renderFilters();
        renderList();
        paintClear();
        if (restoreY) {
          const y = restoreY;
          restoreY = 0;
          requestAnimationFrame(() => window.scrollTo(0, y));
        }
        const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
        if (hash) openCard(hash, false);
      } catch {
        showError(LIBRARY_FAIL);
      }
    }
    boot();
  </script>
</body>
</html>
